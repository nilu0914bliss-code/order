<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2AM SHOPPING 叫貨系統</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="叫貨">
<meta name="application-name" content="叫貨">
<meta name="theme-color" content="#DFDFDB">
<style>
  :root{
    --green:#2F6B4F; --green-d:#1F4A36; --green-soft:#E3EDE7; --green-tint:#F0F5F2;
    --amber:#7C6015; --amber-soft:#F7EFD9; --grad:linear-gradient(135deg,#55554F 0%,#3D3D3D 100%);
    --bg:#DFDFDB; --card:#ffffff; --ink:#3D3D3D; --muted:#7E7E78; --line:#E2E2DE;
    --red:#B04A32; --red-soft:#F8EAE6; --warn:#7C6015; --warn-soft:#F7EFD9;
    --shadow:0 2px 16px rgba(61,61,61,.07); --shadow-lg:0 10px 40px rgba(61,61,61,.12);
    --r:20px; --r-sm:14px;
    --yellow:#DCB849; --pink:#DFAEBB; --blue:#3A5470;
    /* 這三個以前被用到但沒定義，等於一直是無效值 —— 補上 */
    --blue-soft:#E7EAEF; --cash:#F6E6EB; --orange-d:#7C6015;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:.01em;}
  .app{display:block;min-height:100vh;}
  /* ---- sidebar ---- */
  aside{width:246px;background:#FFFFFF;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;
    overflow-y:auto;z-index:60;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-lg);}
  aside.open{transform:translateX(0);}
  .backdrop{position:fixed;inset:0;background:rgba(42,40,35,.28);backdrop-filter:blur(3px);z-index:55;opacity:0;visibility:hidden;transition:opacity .25s;}
  .backdrop.show{opacity:1;visibility:visible;}
  .hamb{font-size:19px;cursor:pointer;background:none;border:none;padding:8px 10px;border-radius:12px;color:var(--ink);transition:.15s;}
  .hamb:hover{background:rgba(27,107,71,.07);}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 20px 14px;font-weight:800;font-size:19px;letter-spacing:-.02em;}
  .brand .mark{width:30px;height:30px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;}
  .brand>span:first-child{display:flex;align-items:center;gap:10px;}
  .acct{display:flex;align-items:center;gap:11px;margin:0 14px 14px;padding:12px 14px;background:var(--green-tint);border-radius:var(--r-sm);}
  .acct .av{width:34px;height:34px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;}
  .acct small{color:var(--muted);font-size:11px;display:block;} .acct b{font-size:14px;}
  .navgrp{font-size:11px;color:var(--muted);padding:14px 22px 6px;font-weight:700;letter-spacing:.06em;}
  .navitem{display:block;margin:2px 12px;padding:11px 16px;color:var(--ink);cursor:pointer;font-size:14.5px;border:none;background:none;
    width:calc(100% - 24px);text-align:left;border-radius:12px;transition:.15s;}
  .navitem:hover{background:var(--green-tint);}
  .navitem.active{background:var(--green);color:#fff;font-weight:600;box-shadow:0 3px 12px rgba(27,107,71,.26);}
  main{width:100%;min-width:0;}
  /* ---- topbar ---- */
  .topbar{height:66px;background:rgba(223,223,219,.88);backdrop-filter:blur(12px);display:flex;align-items:center;padding:0 26px;gap:14px;position:sticky;top:0;z-index:10;}
  .topbar .sp{flex:1;}
  .storeSwitch{display:flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;background:#fff;padding:7px 10px 7px 14px;border-radius:999px;box-shadow:var(--shadow);}
  .storeSwitch select{border:none;background:transparent;font-weight:700;color:var(--green);padding:2px 4px;width:auto;cursor:pointer;box-shadow:none;}
  .icobtn{position:relative;background:#fff;border:none;font-size:17px;cursor:pointer;color:var(--ink);padding:9px 11px;border-radius:999px;box-shadow:var(--shadow);transition:.15s;}
  .icobtn:hover{transform:translateY(-1px);}
  .badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;line-height:17px;border-radius:10px;padding:0 4px;font-weight:700;}
  .content{padding:14px 26px 70px;max-width:1180px;}
  .crumb{color:var(--muted);font-size:12.5px;margin-bottom:3px;}
  h1{font-size:27px;margin:0 0 14px;letter-spacing:-.03em;font-weight:800;}
  /* ---- cards ---- */
  .card{background:var(--card);border:none;border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:14px;align-items:end;}
  .field label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;}
  input,select{font-family:inherit;font-size:14px;padding:11px 14px;border:1.5px solid transparent;border-radius:12px;width:100%;background:#F4F4F1;color:var(--ink);transition:.15s;}
  input:focus,select:focus{outline:none;border-color:var(--green);background:#fff;}
  input::placeholder{color:#A5A59F;}
  /* ---- buttons ---- */
  .btn{background:var(--green);color:#fff;border:none;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:.18s;box-shadow:0 3px 12px rgba(27,107,71,.24);}
  .btn:hover{background:var(--green-d);transform:translateY(-1px);box-shadow:0 5px 16px rgba(27,107,71,.3);}
  .btn.line{background:#fff;color:var(--muted);box-shadow:var(--shadow);} .btn.line:hover{background:#fff;color:var(--ink);}
  .btn.mini{padding:7px 15px;font-size:12.5px;}
  .btn.green{background:var(--green);}
  .btn.grey{background:#EDEDEA;color:var(--ink);box-shadow:none;} .btn.grey:hover{background:#E3E3DF;}
  .btn.amber{background:linear-gradient(135deg,#8F6D18 0%,#6B5312 100%);box-shadow:0 3px 12px rgba(107,83,18,.26);}
  /* ---- table ---- */
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:13px 18px;border-bottom:1px solid var(--line);letter-spacing:.03em;}
  td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:.12s;} tbody tr:hover{background:#F7F7F5;}
  tr.low td{background:var(--amber-soft);}
  .thumb{width:44px;height:44px;border-radius:13px;background:var(--green-tint);display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .pname{display:flex;align-items:center;gap:13px;}
  .spec{font-size:11px;background:#EDEDEA;color:var(--muted);padding:3px 8px;border-radius:7px;margin-left:3px;}
  .unitsw{display:inline-flex;background:#EDEDEA;border-radius:999px;padding:2px;gap:2px;}
  .unitsw button{border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer;}
  .unitsw button.on{background:var(--green);color:#fff;}
  .stepper{display:inline-flex;align-items:center;background:#F4F4F1;border-radius:999px;overflow:hidden;padding:2px;}
  .stepper button{width:28px;height:28px;border:none;background:#fff;font-size:15px;cursor:pointer;color:var(--ink);border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.07);}
  .stepper button:hover{background:var(--green);color:#fff;}
  .stepper input{width:40px;border:none;background:transparent;text-align:center;border-radius:0;padding:6px 0;font-weight:600;}
  .stepper input:focus{background:transparent;border-color:transparent;}
  /* ---- pills ---- */
  .pill{font-size:11px;padding:4px 11px;border-radius:999px;font-weight:700;white-space:nowrap;letter-spacing:.02em;}
  .pill.wait{background:var(--warn-soft);color:var(--warn);} .pill.done{background:var(--green-soft);color:var(--green);}
  .pill.low{background:var(--red);color:#fff;}
  .pill.void{background:#E2E2DE;color:#7E7E78;}
  .voided{opacity:.55;}
  .pill.m{background:var(--green-soft);color:var(--green);} .pill.c{background:var(--amber-soft);color:var(--amber);}
  .muted{color:var(--muted);} .empty{text-align:center;color:var(--muted);padding:48px;} .right{text-align:right;}.center{text-align:center;}
  .sum{display:flex;justify-content:flex-end;align-items:center;gap:22px;margin-top:10px;} .sum b{font-size:20px;color:var(--green);}
  /* ---- toast & modal ---- */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 26px;border-radius:999px;z-index:90;
    opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow-lg);font-weight:500;}
  .toast.show{opacity:1;}
  .modalbg{position:fixed;inset:0;background:rgba(42,40,35,.32);backdrop-filter:blur(4px);z-index:70;display:none;align-items:center;justify-content:center;padding:16px;}
  .modalbg.show{display:flex;}
  .modal{background:#fff;border-radius:24px;padding:26px;max-width:450px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .basisopt{flex:1;display:flex;align-items:center;gap:7px;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;background:#fff;}
  .basisopt:has(input:checked){border-color:var(--green);background:var(--green-tint);color:var(--green);}
  .basisopt input{width:auto;margin:0;accent-color:var(--green);}
  .gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate.hide{display:none;}
  .gatebox{background:#fff;border-radius:24px;padding:30px 28px;max-width:430px;width:100%;box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto;}
  .gatebox h2{margin:0 0 6px;font-size:23px;letter-spacing:-.02em;}
  .gspin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;margin:10px auto;animation:gsp .8s linear infinite;}
  @keyframes gsp{to{transform:rotate(360deg)}}
  .storeopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 17px;border:2px solid var(--line);border-radius:16px;
    background:#fff;cursor:pointer;font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:9px;transition:.15s;}
  .storeopt:hover{border-color:var(--green);}
  .storeopt.sel{border-color:var(--green);background:var(--green-tint);}
  .storeopt .tick{margin-left:auto;color:var(--green);font-size:19px;opacity:0;}
  .storeopt.sel .tick{opacity:1;}
  .switchbtn{width:100%;padding:13px;border:1.5px dashed var(--line);border-radius:16px;background:#fff;
    color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:9px;transition:.15s;}
  .switchbtn:hover{border-color:var(--green);color:var(--green);}
  .storeopt .last{display:block;font-size:11.5px;color:var(--green);font-weight:600;margin-top:2px;}
  .gerr{background:#F8EAE6;color:#8A3826;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px;line-height:1.6;}
  @supports(padding:env(safe-area-inset-top)){
    .topbar{height:auto;min-height:66px;padding-top:calc(9px + env(safe-area-inset-top));padding-bottom:9px;}
    .app,.gate{padding-bottom:env(safe-area-inset-bottom);}}
  .mlab{display:none;}
  .modal.wide{max-width:760px;}
  .modal h3{margin:0 0 18px;font-size:19px;letter-spacing:-.02em;} .modal .fld{margin-bottom:14px;}
  .modal label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;}
  .modact{display:flex;gap:9px;justify-content:flex-end;margin-top:8px;} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .ordhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#F7F7F5;}
  /* ---- KPI ---- */
  .kpis{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:14px;margin-bottom:16px;}
  .kpi{background:var(--card);border:none;border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);}
  .kpi.hero{color:#fff;background:var(--grad);}
  .kpi.hero.good{background:linear-gradient(135deg,#37855B 0%,#1F4A36 100%);}
  .kpi.hero.warn{background:linear-gradient(135deg,#8F6D18 0%,#6B5312 100%);}
  .kpi.hero.bad{background:linear-gradient(135deg,#C97E68 0%,#B04A32 100%);}
  .kpi.hero .lab,.kpi.hero .sub{color:rgba(255,255,255,.88);}
  .kpi.hero .big{color:#fff !important;}
  .kpi.hero .status{background:rgba(255,255,255,.22) !important;color:#fff !important;}
  .kpi.hero .gauge{background:rgba(255,255,255,.28);}
  .kpi.hero .gauge>i{background:#fff !important;}
  .kpi.hero .sub span,.kpi.hero .sub b{color:rgba(255,255,255,.95) !important;}
  .kpi .lab{color:var(--muted);font-size:12.5px;margin-bottom:9px;font-weight:500;}
  .kpi .big{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1;}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:9px;}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;margin-top:11px;}
  .status.good{background:var(--green-soft);color:var(--green);} .status.warn{background:var(--warn-soft);color:var(--warn);} .status.bad{background:var(--red-soft);color:var(--red);}
  .gauge{height:8px;background:#EFEFEC;border-radius:999px;overflow:hidden;margin-top:14px;} .gauge>i{display:block;height:100%;border-radius:999px;transition:width .5s;}
  /* ---- misc ---- */
  .conn{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:999px;margin-bottom:16px;}
  .conn.ok{background:var(--green-soft);color:var(--green);} .conn.load{background:#EDEDEA;color:var(--muted);} .conn.fail{background:var(--warn-soft);color:var(--warn);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;}
  .star{font-size:20px;cursor:pointer;color:var(--amber);user-select:none;transition:.15s;line-height:1;background:none;border:none;padding:4px;}
  .star.off{color:#D2D2CE;} .star:hover{transform:scale(1.18);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 15px;border-radius:999px;background:#F4F4F1;font-size:13.5px;font-weight:600;cursor:pointer;border:none;color:var(--ink);transition:.15s;}
  .chip:hover{background:#EFEFEC;} .chip.on{background:var(--green);color:#fff;box-shadow:0 3px 12px rgba(27,107,71,.24);}
  .chip small{opacity:.7;font-weight:400;margin-left:4px;}
  .barrow{display:flex;align-items:center;gap:12px;margin:9px 0;}
  .barrow .nm{width:132px;font-size:13px;flex-shrink:0;}
  .barrow .track{flex:1;height:12px;background:#F1F1EE;border-radius:999px;overflow:hidden;}
  .barrow .fill{height:100%;background:var(--green);border-radius:999px;transition:width .5s;}
  .barrow .pc{width:104px;text-align:right;font-size:12.5px;flex-shrink:0;}

  /* ===== 手機：表格改成卡片式堆疊，避免欄位擠成一行一個字 ===== */
  @media(max-width:760px){
    .content{padding:8px 12px 60px;}
    h1{font-size:21px;}
    .card{border-radius:16px;padding:16px;}
    table:not(.keepcols) thead{display:none;}
    table:not(.keepcols),table:not(.keepcols) tbody,table:not(.keepcols) tr,table:not(.keepcols) td{display:block;width:100%;}
    table:not(.keepcols) tr{padding:13px 15px;border-bottom:1px solid var(--line);}
    table:not(.keepcols) tbody tr:last-child{border-bottom:none;}
    table:not(.keepcols) td{border:none !important;padding:3px 0 !important;text-align:left !important;white-space:normal;}
    table:not(.keepcols) td:first-child{font-weight:600;font-size:14.5px;}
    table:not(.keepcols) tfoot tr{background:#F7F7F5;}
    .mlab{display:inline;color:var(--muted);font-size:12.5px;font-weight:600;margin-right:6px;}
    .pname{gap:10px;} .thumb{width:38px;height:38px;font-size:16px;}
    /* 手機：加大按鍵，廚房濕手也好按 */
    .stepper{margin-top:8px;padding:3px;}
    .stepper button{width:40px;height:40px;font-size:19px;}
    .stepper input{width:52px;font-size:16px;padding:9px 0;}
    .star{font-size:26px;padding:9px 12px;}
    .btn.mini{padding:11px 18px;font-size:14px;}
    .icobtn,.hamb{min-height:44px;}
    /* 退貨／折讓單的品項表在手機改成堆疊，不用左右滑 */
    .modal table.keepcols{min-width:0 !important;width:100% !important;}
    .modal table.keepcols thead{display:none;}
    .modal table.keepcols,.modal table.keepcols tbody,.modal table.keepcols tr,.modal table.keepcols td{display:block;width:100%;}
    .modal table.keepcols tr{padding:12px 13px;border-bottom:1px solid var(--line);}
    .modal table.keepcols tbody tr:last-child{border-bottom:none;}
    .modal table.keepcols td{border:none !important;padding:4px 0 !important;display:flex;align-items:center;gap:9px;}
    .modal table.keepcols td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;font-weight:600;flex:0 0 62px;}
    .modal table.keepcols td:first-child{display:block;}
    .modal table.keepcols td:first-child::before{display:block;margin-bottom:5px;}
    .modal table.keepcols td input,.modal table.keepcols td select{width:100% !important;flex:1;text-align:left !important;}
    .modal table.keepcols td:last-child{width:100% !important;justify-content:flex-end;}
    .modal table.keepcols td:last-child::before{content:'';flex:0;}
    .btn.mini{padding:9px 16px;font-size:13.5px;}
    .ordhead{flex-wrap:wrap;gap:8px;padding:14px 16px;}
    .kpi .big{font-size:28px;}
    .barrow{flex-wrap:wrap;gap:6px 10px;}
    .barrow .nm{width:auto;flex:1 1 100%;font-weight:600;}
    .barrow .track{flex:1 1 auto;min-width:120px;}
    .barrow .pc{width:auto;}
    .filters{gap:10px;}
    .modal{padding:20px;border-radius:20px;}
    .chips{gap:6px;} .chip{padding:7px 13px;font-size:13px;}
    .storeSwitch{font-size:12.5px;padding:6px 8px 6px 11px;max-width:47vw;}
    .storeSwitch select{max-width:33vw;}
    .topbar{padding:0 14px;gap:8px;}
  }
  @media(max-width:820px){.filters,.grid3,.kpis,.grid2{grid-template-columns:1fr;} .content{padding:10px 16px 60px;} h1{font-size:23px;}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gatebox">
    <div id="gateBody">
      <div class="gspin"></div>
      <div class="muted" style="margin-top:16px;text-align:center">連線中…</div>
    </div>
  </div>
</div>
<div class="app">
  <div class="backdrop" id="backdrop" onclick="closeMenu()"></div>
  <aside id="sidebar">
    <div class="brand" style="justify-content:space-between"><span><span class="mark">🛒</span> 叫貨系統</span><span style="cursor:pointer;font-weight:400;font-size:22px;color:#999" onclick="closeMenu()">×</span></div>
    <div class="acct" id="acctBox"><span class="av">📍</span><div style="min-width:0"><small>目前門市</small><b id="acctStore">—</b></div></div>
    <div style="display:flex;gap:7px;padding:0 18px 12px">
      <button class="btn line mini" style="flex:1" onclick="switchStore()">換門市</button>
      <button class="btn grey mini" style="flex:1" onclick="doLogout()">登出</button></div>
    <div class="navgrp">🛒 日常叫貨</div>
    <button class="navitem" data-page="fav">⭐ 我的最愛</button>
    <button class="navitem" data-page="products">我要叫貨</button>
    <button class="navitem" data-page="weekly">興裕本週菜價上傳</button>
    <button class="navitem" data-page="orders">已送出的訂單</button>
    <button class="navitem" data-page="receiving">收貨確認</button>
    <button class="navitem" data-page="returns">退貨／折讓</button>
    <div class="navgrp">📊 營運與結算</div>
    <button class="navitem active" data-page="dashboard">營運儀表板</button>
    <button class="navitem" data-page="payment">貨款結算</button>
    <div class="navgrp">⚙️ 基本資料建置</div>
    <button class="navitem" data-page="prodadmin">商品與價格</button>

    <div style="margin-top:auto;padding:14px 18px;font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line)">

function supType(name){const s=suppliers.find(x=>x.name===name);return s?s.type:'現金';}
function supPricing(name){const s=suppliers.find(x=>x.name===name);return (s&&s.pricing)||'固定';}
function isoOf(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function weekStartTue(iso){const d=new Date(iso+'T00:00:00');const diff=(d.getDay()-3+7)%7;d.setDate(d.getDate()-diff);return isoOf(d);}
function weekEndOf(ws){const d=new Date(ws+'T00:00:00');d.setDate(d.getDate()+6);return isoOf(d);}
function weeklyPrice(sup,ws,pid){const v=weekly[`${sup}|${ws}|${pid}`];return (v===undefined||v===null||v==='')?null:v;}
// 某商品在某日的單價；null = 尚未定價（時價待填）
/* 單價 0 ＝ 廠商本週沒供應這項，不能叫貨（跟「還沒報價」是兩回事） */
/* 週報廠商這一週有兩種「沒價格」，處理方式不一樣（Nina 2026-08-17 決定）：
   ① 無供應 —— 檔案上明講這週沒有（我們存 0）→ 擋住，叫了也拿不到貨
   ② 未報價 —— 檔案上根本沒出現這一項（沒有值）→ 可以叫，但標「待計價」，
      收貨時照貨單填實際單價（跟源發禾鮮同一套流程），才不會擋到來不及上傳價目表的時候。 */
function weekNA(p,date){return supPricing(p.supplier)==='週報'&&weeklyPrice(p.supplier,weekStartTue(date||isoAt(0)),p.id)===0;}
function weekNoPrice(p,date){return supPricing(p.supplier)==='週報'&&weeklyPrice(p.supplier,weekStartTue(date||isoAt(0)),p.id)==null;}
function weekBlocked(p,date){return weekNA(p,date);}
function weekBlockMsg(p){return '「'+p.name+'」本週廠商沒有供應，不能叫貨';}
function noPriceMsg(p){return '「'+p.name+'」本週未報價，會以「待計價」送出，收貨時再填實際單價';}
function priceFor(p,date){const m=supPricing(p.supplier);
  if(m==='隨貨')return null;
  if(m==='週報')return weeklyPrice(p.supplier,weekStartTue(date||isoAt(0)),p.id);
  return p.price;}
function orderTBD(o){return o.items.some(i=>i.price===null||i.price===undefined||i.price==='');}

function loadDemo(){
  if(!confirm('載入示範資料？\n\n會產生一批「假的」訂單、營業額與最愛，讓你先看整套效果。\n之後可用下方「重設為最新內建資料」全部清掉。'))return;
  const cur=curMonth(),pm=prevMonth(cur);
  // 營業額：連得到打卡系統就用真實的，連不到才灌假的
  if(fb.status!=='ok'){
    manualRev[`${selStore}|${cur}`]=1330000;
    manualRev[`${selStore}|${pm}`]=2790000;
    store.set('p_manualrev',JSON.stringify(manualRev));
  }
  const plan=[['鼎生食品有限公司',5],['興裕農產行',6],['昇大食品行',3],['萬鈞行',3],
              ['久沃食品有限公司',3],['職人包裝有限公司',3],['海自慢食品股份有限公司',2]];
  const offsets=[-72,-68,-64,-60,-56,-52,-48,-44,-40,-36,-32,-28,-24,-20,-16,-12,-9,-6,-4,-2,-1,0];
  const made=[];
  offsets.forEach((off,i)=>{
    const [sup,n]=plan[i%plan.length];
    const list=products.filter(p=>p.supplier===sup&&p.price>0);
    if(!list.length)return;
    const used=new Set(),items=[];
    for(let k=0;k<n;k++){
      const idx=(i*5+k*3)%list.length;let p=list[idx],guard=0;
      while(used.has(p.id)&&guard++<list.length){p=list[(idx+guard)%list.length];}
      if(used.has(p.id))break;used.add(p.id);
      const qty=p.price>1000?1:p.price>300?3:8;
      items.push({id:p.id,name:p.name,spec:p.spec,unit:p.unit,price:p.price,qty});
    }
    if(!items.length)return;
    made.push({no:'PO'+orderSeq(),store:selStore,storeName:curStoreName(),supplier:sup,
      date:isoAt(off),deliveryDate:isoAt(off+1),status:off<=-2?'已驗收':'待驗收',items});
  });
  // 依營業額把數量等比放大，讓物料佔比落在合理範圍（約 42%）
  const winM=monthWindow(cur,'月結');
  const baseMat=made.filter(o=>o.date>=winM.start&&o.date<=winM.end)
    .reduce((s,o)=>s+o.items.reduce((x,i)=>x+i.price*i.qty,0),0);
  const revNow=(fb.status==='ok')?monthRevenueM(cur):(manualRev[`${selStore}|${cur}`]||0);
  if(baseMat>0&&revNow>0){
    const factor=(revNow*0.42)/baseMat;
    if(factor>1.2||factor<0.8)
      made.forEach(o=>o.items.forEach(i=>{i.qty=Math.max(1,Math.round(i.qty*factor));}));
  }
  orders=made.concat(orders);
  // 最愛：前四家各收藏 3 項，並記住常叫數量
  plan.slice(0,4).forEach(([sup])=>{
    products.filter(p=>p.supplier===sup&&p.price>0).slice(0,3).forEach(p=>{
      favs[`${selStore}|${p.id}`]=1;lastQty[`${selStore}|${p.id}`]=p.price>500?2:6;});});
  persist();toast('示範資料已載入 ✓');go('dashboard');
}

const BK_KEYS=['p_products','p_suppliers','p_weekly','p_wkalias','p_linecfg','p_lineusage','p_orders','p_matman','p_cart','p_cartunit','p_manualrev','p_seq','p_favs','p_lastqty','p_projrev','p_returns','p_rseq','p_selstore','p_selstorename','p_selmonth','p_dataver'];
function exportBackup(){
  const data={};BK_KEYS.forEach(k=>{const v=store.get(k);if(v!=null)data[k]=v;});
  const payload={app:'叫貨系統',version:1,exportedAt:new Date().toISOString(),store:curStoreName(),data};
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`叫貨系統備份_${isoAt(0)}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('備份檔已下載 ✓');}
function importBackup(input){const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{let j;try{j=JSON.parse(e.target.result);}catch(err){toast('檔案不是有效的備份檔');return;}
    if(!j||!j.data){toast('備份檔格式不正確');return;}
    const when=(j.exportedAt||'').slice(0,10);
    if(!confirm(`還原備份${when?'（'+when+' 匯出）':''}？\n\n目前裝置上的所有資料會被覆蓋。`)){input.value='';return;}
    BK_KEYS.forEach(k=>{if(j.data[k]!=null)store.set(k,j.data[k]);});
    alert('還原完成，將重新載入。');location.reload();};
  r.readAsText(f);}

window.__applyFB=function(storesData,revenueData){
  let list=Object.entries(storesData||{}).map(([k,v])=>({id:k,name:(v&&v.name)||k}));
  list=list.filter(s=>!/機動/.test(s.name));
  if(list.length)STORES=list;
  if(!selStore||!STORES.find(s=>s.id===selStore))selStore=STORES[0].id;
  fb={status:'ok',revenue:revenueData||{}};
  if(typeof renderGate==='function'&&gateStep==='store')renderGate();
  persistLocal();render();};
window.__failFB=function(){fb={status:'fail',revenue:null};
  if(!STORES.find(s=>s.id===selStore))selStore=STORES[0].id;
  if(typeof renderGate==='function'&&gateStep==='store')renderGate();
  render();};


/* ====================== 雲端多人版：登入 / 門市 / 同步 ====================== */
let CLOUD_ON=false, CLOUD_USER=null, CLOUD_ACL=null, cloudUnsub=[], gateStep='loading', gateErrMsg='';
let __noMigDone=false;   // 舊單號轉新格式，一個 session 只跑一次
function encK(x){return String(x).replace(/[.$#\[\]\/~]/g,c=>'~'+c.charCodeAt(0).toString(16).padStart(2,'0'));}
function decK(x){return String(x).replace(/~([0-9a-f]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));}
function aclKey(em){return String(em||'').replace(/\./g,',').replace(/@/g,',');}
/* ---------- 多客戶（租戶）路徑 ----------
   TENANT_ON=false 時，TP() 回傳空字串，所有路徑跟現在一模一樣，行為零改變。
   資料搬完、核對過之後，只要把 TENANT_ON 改成 true，整套就切到新結構。
   出事就把它改回 false，立刻退回舊資料。 */
let TENANT='jianren';                 // 這家客戶的代號（之後由登入的帳號決定）
const TENANT_ON=false;                // ← 資料還沒搬，先不要動這一行
const TP=()=>TENANT_ON?('tenants/'+TENANT+'/'):'';
const SP=()=>TP()+'order/'+selStore;  // 這間門市：訂單、退貨、購物車
const SH=k=>TP()+'shared/'+k;         // 這家客戶共用：商品、廠商、菜價、LINE
const ACLP=em=>TP()+'acl/'+aclKey(em);

/* ---- 上傳（共用資料 + 本門市設定，不含訂單與退貨單，那兩個逐筆寫） ---- */
function cloudPushShared(){ if(!CLOUD_ON||!window.CLOUD)return;
  const pm={}; products.forEach(p=>{pm[encK(p.id)]=p;});
  const wm={}; Object.keys(weekly).forEach(k=>{wm[encK(k)]=weekly[k];});
  const am={}; Object.keys(wkAlias).forEach(k=>{am[encK(k)]=wkAlias[k];});
  CLOUD.set(SH('products'),pm); CLOUD.set(SH('suppliers'),suppliers); CLOUD.set(SH('weekly'),wm); CLOUD.set(SH('wkalias'),am);
}
function pickStoreMap(obj){const o={},pre=selStore+'|';
  Object.keys(obj||{}).forEach(k=>{if(k.indexOf(pre)===0)o[encK(k.slice(pre.length))]=obj[k];});return o;}
function cloudPushStore(){ if(!CLOUD_ON||!selStore||!window.CLOUD)return;
  CLOUD.set(SP()+'/matManual',pickStoreMap(matManual));
  CLOUD.set(SP()+'/favs',pickStoreMap(favs));
  CLOUD.set(SP()+'/lastQty',pickStoreMap(lastQty));
  CLOUD.set(SP()+'/manualRev',pickStoreMap(manualRev));
  CLOUD.set(SP()+'/projRev',pickStoreMap(projRev));
  /* 購物車也上雲：手機夾一半、回店裡用平板接著夾（Nina 2026-08-17）。
     鍵沒有門市前綴，所以不能用 pickStoreMap，直接整包編碼後放在該門市底下。 */
  CLOUD.set(SP()+'/cart',encMap(cart));
  CLOUD.set(SP()+'/cartUnit',encMap(cartUnit));
}
function encMap(o){const r={};Object.keys(o||{}).forEach(k=>{r[encK(k)]=o[k];});return r;}
function decMap(v){const r={};Object.keys(v||{}).forEach(k=>{r[decK(k)]=v[k];});return r;}
let __pushT=null;
function cloudPush(){ if(!CLOUD_ON)return; clearTimeout(__pushT);
  __pushT=setTimeout(()=>{try{cloudPushShared();cloudPushStore();}catch(e){console.warn('同步失敗',e);}},400); }
/* ---- 訂單／退貨單：逐筆寫，避免兩個人同時下單互相蓋掉 ---- */
function cloudSaveOrder(o){ if(CLOUD_ON&&window.CLOUD)CLOUD.set(SP()+'/orders/'+encK(o.no),o); }
function cloudSaveReturn(r){ if(CLOUD_ON&&window.CLOUD)CLOUD.set(SP()+'/returns/'+encK(r.id),r); }
function cloudDelReturn(id){ if(CLOUD_ON&&window.CLOUD)CLOUD.del(SP()+'/returns/'+encK(id)); }

/* ---- 監聽：別人改了，我這邊自動更新 ---- */
function cloudBind(){
  cloudUnsub.forEach(u=>{try{u();}catch(e){}}); cloudUnsub=[];
  __noMigDone=false;   // 換門市要重新檢查那一間的舊單號
  const applyMap=(target,v)=>{const pre=selStore+'|';
    Object.keys(target).forEach(k=>{if(k.indexOf(pre)===0)delete target[k];});
    Object.keys(v||{}).forEach(k=>{target[pre+decK(k)]=v[k];});};
  // 商品資料版本比對：新版一上線，第一台開啟的裝置把核對過的資料推上雲端，其他人自動同步
  CLOUD.read(SH('dataver')).then(cv=>{
    if(cv!==DATA_VER){ const custom=products.filter(p=>/^x/.test(p.id));   // 上傳價目表時自己建的品項要保留
      products=seedProducts().concat(custom); suppliers=defaultSuppliers();
      cloudPushShared(); CLOUD.set(SH('dataver'),DATA_VER); render(); }
  }).catch(()=>{});
  cloudUnsub.push(CLOUD.watch(SH('products'),v=>{
    if(v&&Object.keys(v).length)products=Object.keys(v).map(k=>v[k]);
    else if(products.length)cloudPushShared();
    if(migrateAltUnits()){persistLocal();cloudPushShared();}
    if(purgeOldAlias()){persistLocal();cloudPushShared();}
    if(dedupeProducts()){persistLocal();cloudPushShared();}
    render();}));
  cloudUnsub.push(CLOUD.watch(SH('suppliers'),v=>{
    if(v&&Object.keys(v).length)suppliers=Object.keys(v).map(k=>v[k]);
    else if(suppliers.length)cloudPushShared();
    render();}));
  cloudUnsub.push(CLOUD.watch(SH('weekly'),v=>{
    if(v){weekly={};Object.keys(v).forEach(k=>{weekly[decK(k)]=v[k];});}
    else if(Object.keys(weekly).length)cloudPushShared();
    render();}));
  cloudUnsub.push(CLOUD.watch(SH('line'),v=>{ if(v&&v.url!==undefined){lineCfg={...lineCfg,...v};persistLocal();render();} }));
  cloudUnsub.push(CLOUD.watch(SH('lineUsage'),v=>{ if(v){lineUsage=v;persistLocal();render();} }));
  cloudUnsub.push(CLOUD.watch(SH('wkalias'),v=>{
    if(v){wkAlias={};Object.keys(v).forEach(k=>{wkAlias[decK(k)]=v[k];});}
    else if(Object.keys(wkAlias).length)cloudPushShared();}));
  cloudUnsub.push(CLOUD.watch(SP()+'/orders',v=>{
    orders=v?Object.keys(v).map(k=>v[k]).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.no<b.no?1:-1)):[];
    persistLocal();render();
    /* 訂單從雲端回來之後才有辦法改單號，而且一個 session 只試一次 */
    /* ⚠️ 2026-08-25 停用：這段會邊寫邊刪，而雲端 watcher 會在中途換掉 orders，
       導致後面幾筆「新的沒寫進去、舊的卻被刪掉」。修好並驗證前不要再自動跑。 */
    // if(!__noMigDone){__noMigDone=true; setTimeout(()=>migrateOrderNos(),1200);}
  }));
  cloudUnsub.push(CLOUD.watch(SP()+'/returns',v=>{
    returns=v?Object.keys(v).map(k=>fixRet(v[k])):[];persistLocal();render();}));
  [['matManual',()=>matManual],['favs',()=>favs],['lastQty',()=>lastQty],['manualRev',()=>manualRev],['projRev',()=>projRev]]
    .forEach(([name,get])=>{cloudUnsub.push(CLOUD.watch(SP()+'/'+name,v=>{applyMap(get(),v);persistLocal();render();}));});
  /* 購物車：Firebase 清空時整個節點會不見，所以 v 是空的就當成空車 */
  cloudUnsub.push(CLOUD.watch(SP()+'/cart',v=>{cart=decMap(v);persistLocal();badges();render();}));
  cloudUnsub.push(CLOUD.watch(SP()+'/cartUnit',v=>{cartUnit=decMap(v);persistLocal();render();}));
}

window.__cloudReady=function(){
  if(!window.CLOUD){gateStep='error';gateErrMsg='連不到雲端，請檢查網路後重新整理。';renderGate();return;}
  CLOUD.onAuth(async u=>{
    CLOUD_USER=u;
    if(!u){CLOUD_ON=false;CLOUD_ACL=null;gateStep='login';renderGate();
      document.getElementById('gate').classList.remove('hide');return;}
    gateStep='store';renderGate();
    try{CLOUD_ACL=await CLOUD.read(ACLP(u.email));}catch(e){CLOUD_ACL=null;}
    if(!CLOUD_ACL){gateStep='noacl';}
    renderGate();
  });
};
function allowedStores(){
  if(!CLOUD_ACL)return [];
  if(CLOUD_ACL.all===true)return STORES;
  const m=CLOUD_ACL.stores||{};
  return STORES.filter(s=>m[s.id]===true);
}

window.doLogin=async function(){
  const em=(document.getElementById('gEmail')||{}).value, pw=(document.getElementById('gPw')||{}).value;
  if(!em||!pw){gateErrMsg='請輸入帳號與密碼';renderGate();return;}
  const btn=document.getElementById('gBtn');if(btn){btn.textContent='登入中…';btn.disabled=true;}
  try{ await CLOUD.login(em.trim(),pw); gateErrMsg=''; store.set('p_lastemail',JSON.stringify(em.trim())); }
  catch(e){ const c=(e&&e.code)||'';
    gateErrMsg = /wrong-password|invalid-credential|invalid-login/.test(c)?'帳號或密碼不對，再試一次。'
      : /user-not-found/.test(c)?'找不到這個帳號。'
      : /too-many-requests/.test(c)?'嘗試太多次，請等幾分鐘再試。'
      : /network/.test(c)?'連不上網路，檢查一下訊號。'
      : '登入失敗：'+c;
    gateStep='login';renderGate(); }
};
window.doReset=async function(){
  const el=document.getElementById('gRstEmail'), em=((el&&el.value)||'').trim();
  if(!em){ gateErrMsg='請先填信箱'; renderGate(); return; }
  const btn=document.getElementById('gRstBtn'); if(btn){btn.disabled=true;btn.textContent='寄送中…';}
  try{ await CLOUD.sendReset(em); }
  catch(e){ /* 就算這個信箱沒有帳號也照樣顯示已寄出，不然會變成拿來試探哪些信箱有註冊 */ }
  gateSentTo=em; gateErrMsg=''; gateStep='sent'; renderGate();
};
window.doLogout=async function(){ try{await CLOUD.logout();}catch(e){} gatePick='';gateErrMsg='';
  try{store.set('p_brand',JSON.stringify(''));}catch(e){}   // 登出就忘掉品牌，換人登入不會看到上一家的招牌

/* ============================================================
   搬家工具　—　把資料複製到 tenants/<客戶>/ 底下
   規則（8/25 那次的教訓，一條都不能少）：
   1. 只從雲端直接讀，絕不從記憶體裡的陣列讀
      （Firebase 的 watcher 會在迴圈跑到一半把陣列換掉）
   2. 只新增，不刪除。舊路徑從頭到尾一個字都不動
   3. 每一步都印出筆數
   4. 重複按沒關係，結果一樣
   5. 核對是獨立重算，不用系統自己的函式
   ============================================================ */
const MIG_BRANCHES=['shared','order','acl'];
/* 誰看得到搬家工具：ACL 是「所有門市」的帳號＝老闆。
   不寫死信箱，這樣賣給別家客戶時他們的老闆帳號也適用，店員帳號則看不到。 */
function migCanSee(){ return !!(typeof CLOUD_ACL!=='undefined' && CLOUD_ACL && CLOUD_ACL.all===true); }

function migLog(html,cls){
  const b=document.getElementById('migLog'); if(!b)return;
  b.insertAdjacentHTML('beforeend','<div class="migline '+(cls||'')+'">'+html+'</div>');
  b.scrollTop=b.scrollHeight;
}
function migCount(v){
  if(v==null)return 0;
  if(Array.isArray(v))return v.length;
  if(typeof v==='object')return Object.keys(v).length;
  return 1;
}
function migSize(v){ try{return JSON.stringify(v).length;}catch(e){return -1;} }

        <button class="btn grey mini" onclick="document.getElementById('migModal').style.display='none'">關閉</button></div>
      <div class="mignote">
        目標位置：<code>tenants/${TENANT}/</code><br>
        <b>只會新增，不會刪除任何東西。</b>現在的資料原封不動留在原位，系統也還是讀舊的。

      <div class="migbtns">
        <button class="btn" id="migB1" onclick="migCopy()">① 複製到新結構</button>

      .mighead{display:flex;align-items:center;gap:12px;font-size:16px;margin-bottom:10px}
      .mighead b{flex:1}
      .mignote{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:10px;
        padding:11px 13px;font-size:12.5px;line-height:1.7;margin-bottom:12px}

window.migCopy=async function(){
  const b=document.getElementById('migB1'); if(b){b.disabled=true;b.textContent='複製中…';}
  migLog('══ ① 複製到新結構　'+new Date().toLocaleString('zh-TW')+' ══','hd');
  migLog('目標：tenants/'+TENANT+'/','dim');
  try{
    for(const br of MIG_BRANCHES){
      migLog('讀取 '+br+' …','dim');
      const v=await CLOUD.read(br);                       // ← 直接從雲端讀，不碰記憶體陣列
      if(v==null){ migLog('  '+br+'：空的，跳過（不寫入）','dim'); continue; }
      const n=migCount(v), sz=migSize(v);
      migLog('  '+br+'：'+n+' 個項目，'+(sz/1024).toFixed(1)+' KB');
      await CLOUD.set('tenants/'+TENANT+'/'+br, v);       // ← 只寫新路徑
      migLog('  ✔ 已寫入 tenants/'+TENANT+'/'+br,'ok');
    }
    migLog('① 複製完成。舊資料完全沒有被動到。','ok');
    migLog('接著按 ② 核對新舊。','dim');
  }catch(e){
    migLog('✘ 出錯了：'+(e&&e.message||e),'bad');
    migLog('舊資料沒有被刪除，可以直接重按一次。','dim');
  }
  if(b){b.disabled=false;b.textContent='① 複製到新結構';}
};

window.migVerify=async function(){
  const b=document.getElementById('migB2'); if(b){b.disabled=true;b.textContent='核對中…';}
  migLog('══ ② 核對新舊　'+new Date().toLocaleString('zh-TW')+' ══','hd');
  let allOk=true;
  try{
    for(const br of MIG_BRANCHES){
      const a=await CLOUD.read(br);
      const c=await CLOUD.read('tenants/'+TENANT+'/'+br);
      const na=migCount(a), nc=migCount(c);
      const sa=JSON.stringify(a===undefined?null:a), sc=JSON.stringify(c===undefined?null:c);
      const same=(sa===sc);
      if(!same)allOk=false;
      migLog((same?'✔ ':'✘ ')+br+'　舊 '+na+' 項 / 新 '+nc+' 項　'
             +(same?'內容完全相同':'內容不同！'), same?'ok':'bad');
    }
    /* 訂單另外獨立算一次金額，不用系統自己的函式 */
    const oldO=await CLOUD.read('order');
    const newO=await CLOUD.read('tenants/'+TENANT+'/order');
    const tally=root=>{
      const r={orders:0,items:0,amount:0,stores:0,byStatus:{}};
      Object.keys(root||{}).forEach(st=>{
        r.stores++;
        const os=(root[st]||{}).orders||{};
        Object.keys(os).forEach(k=>{
          const o=os[k]; if(!o)return;
          r.orders++;
          r.byStatus[o.status||'(無)']=(r.byStatus[o.status||'(無)']||0)+1;
          (o.items||[]).forEach(i=>{
            r.items++;
            if(i && i.price!=null && i.qty!=null) r.amount+=Number(i.price)*Number(i.qty);
          });
        });
      });
      return r;
    };
    const A=tally(oldO), C=tally(newO);
    migLog('── 訂單獨立重算（不用系統的函式）──','hd');
    const rows=[['門市數',A.stores,C.stores],['訂單張數',A.orders,C.orders],
                ['品項筆數',A.items,C.items],
                ['金額合計',A.amount.toFixed(2),C.amount.toFixed(2)]];
    rows.forEach(([k,x,y])=>{
      const ok=String(x)===String(y); if(!ok)allOk=false;
      migLog((ok?'✔ ':'✘ ')+k+'　舊 '+x+' / 新 '+y, ok?'ok':'bad');
    });
    const ks=[...new Set([...Object.keys(A.byStatus),...Object.keys(B_safe(C.byStatus))])];
    ks.forEach(k=>{
      const x=A.byStatus[k]||0, y=C.byStatus[k]||0, ok=(x===y); if(!ok)allOk=false;
      migLog((ok?'✔ ':'✘ ')+'　狀態「'+k+'」　舊 '+x+' / 新 '+y, ok?'ok':'bad');
    });
    migLog(allOk?'══ 全部對得起來 ✔　可以進行下一步 ══':'══ 有對不起來的項目 ✘　先不要往下走 ══', allOk?'ok':'bad');
  }catch(e){
    migLog('✘ 核對出錯：'+(e&&e.message||e),'bad');
  }
  if(b){b.disabled=false;b.textContent='② 核對新舊';}
};

/* ====== 結算區間與物料計算 ====== */
function monthWindow(month,type){const [y,m]=month.split('-').map(Number);
  if(type==='現金'){const last=new Date(y,m,0).getDate();return{start:`${month}-01`,end:`${month}-${pad2(last)}`};}
  const pm=m===1?{y:y-1,m:12}:{y,m:m-1};return{start:`${pm.y}-${pad2(pm.m)}-26`,end:`${month}-25`};}
// 稅別：廠商報價是含稅還是未稅（預設含稅＝維持原本算法不變）
function supTax(name){const s=suppliers.find(x=>x.name===name);return (s&&s.tax)||'含稅';}
function isTaxFree(pid){const p=products.find(x=>x.id===pid);return !!(p&&p.taxfree);}
// 免稅品項（例如鮮奶）不課 5%
function taxFreeInRange(supplier,start,end){
  return orders.filter(o=>o.store===selStore&&o.supplier===supplier&&o.status==='已驗收'&&costDate(o)>=start&&costDate(o)<=end)
    .reduce((s,o)=>s+(o.items||[]).reduce((t,i)=>t+(isTaxFree(i.id)?((i.price||0)*i.qty):0),0),0);}
function taxOf(name,net,exempt){if(supTax(name)!=='未稅')return 0;
  return Math.round(Math.max(0,net-(exempt||0))*0.05);}
function withTax(name,net){return net+taxOf(name,net);}
function retTotal(r){const m=Number(r.override);if(r.override!==''&&r.override!=null&&!isNaN(m))return m;
  return (r.items||[]).reduce((s,i)=>s+(Number(i.amount)||0),0);}
// 退貨／折讓：某廠商在日期區間內的總扣款（正數）
function returnsInRange(supplier,start,end){return returns.filter(r=>r.store===selStore&&r.supplier===supplier&&r.date>=start&&r.date<=end).reduce((s,r)=>s+retTotal(r),0);}
function returnsOn(supplier,date){return returns.filter(r=>r.store===selStore&&r.supplier===supplier&&r.date===date);}
function returnsWin(supplier,win){return returnsInRange(supplier,win.start,win.end);}
function autoMaterial(supplier,win){const g=grossMaterial(supplier,win),net=g-returnsWin(supplier,win);
  return net+taxOf(supplier,net,taxFreeInRange(supplier,win.start,win.end));}
// 貨款歸期依據：每家廠商可各自設定（跟著他們帳單的算法）
function supBasis(name){const s=suppliers.find(x=>x.name===name);return (s&&s.basis)||'收貨日';}
function costDate(o){const b=supBasis(o.supplier);
  if(b==='下單日')return o.date;
  if(b==='出貨日')return o.deliveryDate||o.date;
  return o.receivedAt||o.deliveryDate||o.date;}
function expectDate(o){return supBasis(o.supplier)==='下單日'?o.date:(o.deliveryDate||o.date);}
// ⭐ 只有「已驗收」的訂單才算進貨款與物料成本（收到貨才算錢）
function grossMaterial(supplier,win){return orders.filter(o=>o.store===selStore&&o.supplier===supplier&&o.status==='已驗收'&&costDate(o)>=win.start&&costDate(o)<=win.end).reduce((s,o)=>s+orderTotal(o),0);}
// 已送出但還沒收貨的金額（先讓大家看得到，還沒算進貨款）
function pendingMaterial(supplier,win){return orders.filter(o=>o.store===selStore&&o.supplier===supplier&&o.status!=='已驗收'&&o.status!=='已作廢'&&expectDate(o)>=win.start&&expectDate(o)<=win.end).reduce((s,o)=>s+orderTotal(o),0);}
function manualOn(supplier,date){return matManual[`${selStore}|${supplier}|${date}`]||0;}
function manualMaterialM(supplier,month){ // 該結算區間內所有手動調整加總
  const win=monthWindow(month,supType(supplier));const prefix=`${selStore}|${supplier}|`;let sum=0;
  Object.keys(matManual).forEach(k=>{if(!k.startsWith(prefix))return;const d=k.slice(prefix.length);
    const v=Number(matManual[k])||0;
    if(d.length===7){if(d===month)sum+=v;}          // 舊格式（整月）
    else if(d>=win.start&&d<=win.end)sum+=v;});
  return sum;}
function manualMaterial(supplier){return manualMaterialM(supplier,selMonth);}
function daysInMonth(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate();}
// 這個月已經有營業額紀錄的天數（推估的基礎）
function revDays(month){
  if(fb.status==='ok'){const sr=(fb.revenue||{})[selStore]||{};
    return Object.keys(sr).filter(d=>d.startsWith(month)&&dayRevenueFB(d)>0).length;}
  const cur=curMonth();
  if(month<cur)return daysInMonth(month);
  if(month>cur)return 0;
  return Number(isoAt(0).split('-')[2]);}
// 依目前日均推估整月營收
function projectedRevenue(month){const d=revDays(month),total=monthRevenueM(month),dim=daysInMonth(month);
  if(!d||!total)return 0;
  return d>=dim?total:Math.round(total/d*dim);}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
// 營業額：該月 1 號到第 day 天
function revenueUpTo(month,day){
  if(fb.status!=='ok')return null;
  const sr=(fb.revenue||{})[selStore]||{};
  return Object.keys(sr).filter(d=>d.startsWith(month)&&Number(d.split('-')[2])<=day)
    .reduce((s,d)=>s+dayRevenueFB(d),0);}
function elapsedDayOfMonth(month){const cur=curMonth();
  if(month<cur)return daysInMonth(month);
  if(month>cur)return 0;
  return Number(isoAt(0).split('-')[2]);}
// 物料：指定日期區間內的金額
function materialInRange(supplier,start,end){
  const auto=orders.filter(o=>o.store===selStore&&o.supplier===supplier&&o.status==='已驗收'&&costDate(o)>=start&&costDate(o)<=end)
    .reduce((s,o)=>s+orderTotal(o),0);
  const prefix=`${selStore}|${supplier}|`;let man=0;
  Object.keys(matManual).forEach(k=>{if(!k.startsWith(prefix))return;const d=k.slice(prefix.length);
    if(d.length===7)return;                       // 舊的整月格式無法比同期，略過
    if(d>=start&&d<=end)man+=Number(matManual[k])||0;});
  const net=auto-returnsInRange(supplier,start,end);
  return net+taxOf(supplier,net,taxFreeInRange(supplier,start,end))+man;}
// 某廠商：本期已過的天數 vs 上期同樣天數
function supplierSamePeriod(supplier,month,pm){
  const t=supType(supplier),w=monthWindow(month,t),wp=monthWindow(pm,t),today=isoAt(0);
  const end=today<w.end?today:w.end;
  if(end<w.start)return {cur:0,prev:0,days:0};
  const elapsed=daysBetween(w.start,end);
  let pEnd=addDays(wp.start,elapsed); if(pEnd>wp.end)pEnd=wp.end;
  return {cur:materialInRange(supplier,w.start,end),prev:materialInRange(supplier,wp.start,pEnd),days:elapsed+1};}
function totalSamePeriod(month,pm){let c=0,p=0;
  suppliers.forEach(sp=>{const r=supplierSamePeriod(sp.name,month,pm);c+=r.cur;p+=r.prev;});
  return {cur:c,prev:p};}
function projOverride(month){const v=projRev[`${selStore}|${month}`];
  return (v===undefined||v===null||v==='')?null:Number(v);}
function effProjRevenue(month){const o=projOverride(month);return o!=null?o:projectedRevenue(month);}

    ${auto?`<div class="muted" style="font-size:12px;margin-bottom:6px">系統依目前日均推估為 <b style="color:var(--ink)">$${fmt(auto)}</b>（僅供參考）</div>`:''}

function prevMonth(m){const [y,mo]=m.split('-').map(Number);return mo===1?`${y-1}-12`:`${y}-${pad2(mo-1)}`;}
function datesBetween(a,b){const out=[];const d=new Date(a+'T00:00:00'),end=new Date(b+'T00:00:00');
  while(d<=end){out.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`);d.setDate(d.getDate()+1);}return out;}

function supplierMaterialM(supplier,month){const win=monthWindow(month,supType(supplier));return autoMaterial(supplier,win)+manualMaterialM(supplier,month);}

// 本月還能叫多少貨：依推估營收 × 目標% 反推物料預算
function budgetCard(month,matUsed){
  const proj=effProjRevenue(month),manual=projOverride(month)!=null,days=revDays(month),dim=daysInMonth(month);

  const budget=Math.round(proj*TARGET/100);
  const remain=budget-matUsed;
  const usedPct=budget?Math.min(100,matUsed/budget*100):0;

  const daily=days?Math.round(actual/days):0;

      <div style="flex:1;min-width:240px">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">

      預估整月營收 <b style="color:var(--ink)">$${fmt(proj)}</b>${manual?'（手動設定）':''}（目前實績 $${fmt(actual)}）　×　目標物料比 <b style="color:var(--ink)">${TARGET}%</b>
      　=　可用物料 <b style="color:var(--ink)">$${fmt(budget)}</b>
      ${over?`<div style="color:var(--red);font-weight:700;margin-top:6px">⚠️ 已超出預算 $${fmt(-remain)}，再叫貨物料佔比會更高</div>`
            :usedPct>85?`<div style="color:var(--warn);font-weight:700;margin-top:6px">⚠️ 預算只剩 ${(100-usedPct).toFixed(0)}%，叫貨請留意</div>`:''}
    </div></div>`;
}
// 月增減：mode up-bad（成本，漲=紅）/ up-good（營收，漲=綠）
function momChip(cur,prev,label,mode,big){
  if(!prev){return `<span class="muted" style="font-size:${big?12:11.5}px">${cur?label+'無資料':'—'}</span>`;}
  const d=(cur-prev)/prev*100;
  const up=d>0.05,down=d<-0.05;
  const good=(mode==='up-good')?up:down;
  const col=(!up&&!down)?'var(--muted)':(good?'var(--green)':'var(--red)');
  const arrow=up?'▲':down?'▼':'—';
  const cls=big?'':'pill';
  const bg=big?'':(!up&&!down?'background:#EDEDEA;color:var(--muted)':good?'background:var(--green-soft);color:var(--green)':'background:var(--red-soft);color:var(--red)');
  return `<span class="${cls}" style="${bg};${big?'color:'+ (mode==='up-good'&&big?'rgba(255,255,255,.95)':col)+';font-weight:700;font-size:12.5px':''}">${arrow} ${Math.abs(d).toFixed(1)}%</span>${big?`<span class="muted" style="font-size:11.5px"> vs ${label} $${fmt(prev)}</span>`:''}`;
}
// 佔比用「百分點」比較
function ppDelta(cur,prev,label){
  if(cur==null||prev==null)return `<span class="muted">${label}無資料</span>`;
  const d=cur-prev;const up=d>0.05,down=d<-0.05;
  const col=(!up&&!down)?'var(--muted)':(down?'var(--green)':'var(--red)');
  return `<span style="color:${col};font-weight:700">${up?'▲':down?'▼':'—'} ${Math.abs(d).toFixed(1)} 個百分點</span><span class="muted"> vs ${label} ${prev.toFixed(1)}%</span>`;
}
function health(pct){if(pct==null)return{cls:'',color:'var(--muted)',icon:'',label:'尚無資料'};
  if(pct<=TARGET)return{cls:'good',color:'var(--green)',icon:'●',label:'健康'};
  if(pct<=TARGET+8)return{cls:'warn',color:'var(--amber)',icon:'▲',label:'偏高，注意'};
  return{cls:'bad',color:'var(--red)',icon:'■',label:'過高，需檢討'};}

function rAttachPhoto(input){const fl=input.files&&input.files[0];if(!fl)return;

    img.onload=()=>{const max=1400;let w=img.width,h=img.height;

function rRecalc(i){const q=document.querySelector(`[data-ri="${i}"][data-rf="qty"]`),pr=document.querySelector(`[data-ri="${i}"][data-rf="price"]`),am=document.querySelector(`[data-ri="${i}"][data-rf="amount"]`);

function saveReturn(){
  rSyncTop();
  /* 用 toast 不用 alert：alert 在手機上很突兀，而且會擋住整個畫面 */
  if(!rDraft.supplier){toast('請選廠商');return;}
  if(!rDraft.date){toast('請填銷退日期');return;}
  rDraft.items=(rDraft.items||[]).filter(i=>(i.name||'').trim()!=='');
  const tot=rDraft.override!==''&&rDraft.override!=null?Number(rDraft.override):rSum();
  if(!(tot>0)){toast('請填「這張單要扣多少」，不然不會從貨款扣掉');return;}
  rDraft.store=selStore;
  if(!rDraft.id){rDraft.id='R'+String(Date.now()).slice(-8);rDraft.createdAt=isoAt(0);returns.push(rDraft);}
  else{const i=returns.findIndex(x=>x.id===rDraft.id);if(i>=0)returns[i]=rDraft;}
  cloudSaveReturn(rDraft);persist();hideModal();toast('退貨／折讓單已儲存 ✓');render();}
function delReturn(id){if(!confirm('確定刪除這張退貨／折讓單？貨款會加回去。'))return;

  cloudDelReturn(id);persist();hideModal();toast('已刪除');render();}

function chkLineId(){const el=document.getElementById('sLineTo'),box=document.getElementById('lnChk');
  if(!el||!box)return;
  const raw=el.value.trim();
  if(!raw){box.innerHTML='<span class="muted">沒填就不會自動發，送出訂單後可以手動傳。</span>';return;}
  const c=cleanLineId(raw);
  if(lineIdOk(c)){
    box.innerHTML=(c===raw)
      ?'<span style="color:var(--green);font-weight:700">✓ 格式正確</span>'
      :'<span style="color:#7C6015;font-weight:700">⚠ 貼到多餘的字，儲存時會自動修成：</span><br><code style="word-break:break-all">'+esc(c)+'</code>';
  }else{
    box.innerHTML='<span style="color:#B04A32;font-weight:700">✗ 這不像群組 ID</span><span class="muted"> — 應該是 C 開頭再接 32 個英數字。請回 Apps Script 那頁只複製 <code>C…</code> 那一串。</span>';
  }}
function saveSupplier(i){const name=document.getElementById('sName').value.trim();const type=document.getElementById('sType').value;
  const pricing=document.getElementById('sPricing').value;
  const tax=document.getElementById('sTax').value;
  const basis=document.getElementById('sBasis').value;
  if(!name){toast('請輸入廠商名稱');return;}
  if(suppliers.some((x,j)=>x.name===name&&j!==i)){toast('已有同名廠商');return;}
  const lineToRaw=(document.getElementById('sLineTo')||{value:''}).value.trim();
  const lineTo=cleanLineId(lineToRaw);
  if(lineToRaw&&!lineIdOk(lineTo)){toast('LINE 群組 ID 格式不對，先修好再存');return;}
  const lineSize=Math.max(1,parseInt((document.getElementById('sLineSize')||{}).value)||1);
  if(i>=0)suppliers[i]={...suppliers[i],name,type,pricing,tax,basis,lineTo,lineSize};else suppliers.push({name,type,pricing,tax,basis,lineTo,lineSize});
  persist();hideModal();toast('已儲存 ✓');render();}

/* ===== 調價通知：拿這一週跟上一週比，廠商不用配合也看得到漲跌 ===== */
function prevWeekOf(w){const d=new Date(w+'T00:00:00');d.setDate(d.getDate()-7);return isoOf(d);}
function priceChanges(sup,w){
  const pw=prevWeekOf(w),up=[],down=[],newly=[],stopped=[],same=[];
  products.filter(p=>p.supplier===sup).forEach(p=>{
    const a=weeklyPrice(sup,pw,p.id),b=weeklyPrice(sup,w,p.id);
    if(b==null)return;                       // 這週沒報價，不算
    if(a==null){if(b>0)newly.push({p,now:b});return;}
    if(b===0&&a>0){stopped.push({p,was:a});return;}
    if(a===0&&b>0){newly.push({p,now:b});return;}
    const d=Math.round((b-a)*100)/100;
    if(d>0)up.push({p,was:a,now:b,d});
    else if(d<0)down.push({p,was:a,now:b,d:-d});
    else same.push(p);});
  const by=(x,y)=>y.d-x.d;up.sort(by);down.sort(by);
  return {pw,up,down,newly,stopped,same};}

     :`<div style="background:var(--green-soft);color:var(--green);border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;margin-bottom:14px">這週價格跟上週完全一樣，沒有調價</div>`}
    <div style="max-height:52vh;overflow:auto;background:#F4F4F1;padding:10px;border-radius:12px">

function splitRows(text){return text.split(/\r?\n/).filter(l=>l.trim()!=='').map(line=>{
  if(line.includes('\t'))return line.split('\t').map(s=>s.trim());
  if(line.includes(','))
    {const cells=[];let cur='',q=false;
     for(let i=0;i<line.length;i++){const c=line[i];
       if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}
       else if(c===','&&!q){cells.push(cur);cur='';}else cur+=c;}
     cells.push(cur);return cells.map(s=>s.trim());}
  return line.trim().split(/\s{1,}|　+/).map(s=>s.trim());});}
// 民國日期區間，例：115.08/12-115.08/18
function rocRange(text){const m=String(text).match(/(\d{2,3})[.\/](\d{1,2})[\/.](\d{1,2})\s*[-~～至]\s*(?:(\d{2,3})[.\/])?(\d{1,2})[\/.](\d{1,2})/);
  if(!m)return null;const y1=+m[1]+1911,y2=(m[4]?+m[4]:+m[1])+1911;
  return {start:`${y1}-${pad2(+m[2])}-${pad2(+m[3])}`,end:`${y2}-${pad2(+m[5])}-${pad2(+m[6])}`};}
// 解析報價單：支援同頁多個「項次/品名/單位/單價」欄區並排
function parseSheet(rows){
  let period=null;
  for(let r=0;r<Math.min(rows.length,8)&&!period;r++)
    for(const c of (rows[r]||[])){const p=rocRange(c);if(p){period=p;break;}}
  const groups=[],headerRows=new Set();
  rows.forEach((row,r)=>{let isH=false;
    (row||[]).forEach((cell,c)=>{
      if(!/^\s*(品名|名稱|商品|品項|菜名)\s*$/.test(String(cell)))return;
      isH=true;let u=-1,p=-1,note=-1,memo=-1;
      for(let k=c+1;k<=c+3&&k<row.length;k++){const h=String(row[k]);
        if(u<0&&/單位|規格/.test(h))u=k;
        if(p<0&&/單價|價格|售價|報價/.test(h))p=k;}
      if(p<0)return;
      // 單價右邊那一欄：標題空白＝品名寫不下續行；標題是「件／備註」＝備註，絕對不能當成價格
      if(p+1<row.length){const h=String(row[p+1]||'').trim();
        if(h==='')note=p+1; else if(/^(件|箱|備註|附註|說明|memo)$/i.test(h))memo=p+1;}
      if(!groups.some(g=>g.n===c))groups.push({n:c,u,p,note,memo});});
    if(isH)headerRows.add(r);});
  if(!groups.length)return null;
  const items=[];let zero=0;
  rows.forEach((row,r)=>{if(headerRows.has(r)||!row)return;
    groups.forEach(g=>{
      let name=String(row[g.n]==null?'':row[g.n]).trim();
      if(!name||/品名|名稱|合計|總計|報價單/.test(name))return;
      const nt=g.note>=0?String(row[g.note]==null?'':row[g.note]).trim():'';
      if(nt&&isNaN(parseFloat(nt)))name+=' '+nt;
      const memo=g.memo>=0?String(row[g.memo]==null?'':row[g.memo]).trim():'';
      const unit=g.u>=0?String(row[g.u]==null?'':row[g.u]).trim():'';
      const price=parseFloat(String(row[g.p]==null?'':row[g.p]).replace(/[^0-9.\-]/g,''));
      if(isNaN(price))return;
      const na=price<=0;if(na)zero++;
      items.push({name,unit,price:na?0:price,memo,na});});});
  const seen={};const uniq=[];
  items.forEach(it=>{const k=it.name+'|'+it.unit;if(seen[k])return;seen[k]=1;uniq.push(it);});
  return {items:uniq,period,zero};}
// 簡易格式（貼上文字）備援
function rowsToItems(rows){
  const r=parseSheet(rows);if(r&&r.items.length)return r;
  let ni=-1,pi=-1,ui=-1,start=0;
  for(let r2=0;r2<Math.min(rows.length,12);r2++){const c=(rows[r2]||[]).map(x=>String(x));
    const a=c.findIndex(x=>/品名|名稱|商品|品項|貨品|菜名/.test(x));
    const b=c.findIndex(x=>/單價|價格|金額|售價|報價|價$/.test(x));
    if(a>=0&&b>=0){ni=a;pi=b;ui=c.findIndex(x=>/單位|規格/.test(x));start=r2+1;break;}}
  if(ni<0){for(const row of rows){const a=row.findIndex(x=>x!==''&&isNaN(parseFloat(x)));
      const b=row.findIndex((x,i)=>i!==a&&x!==''&&!isNaN(parseFloat(String(x).replace(/[^0-9.\-]/g,''))));
      if(a>=0&&b>=0){ni=a;pi=b;start=0;break;}}}
  if(ni<0)return{items:[],period:null,zero:0};
  const out=[];let zero=0;
  for(let r2=start;r2<rows.length;r2++){const row=rows[r2]||[];const nm=String(row[ni]==null?'':row[ni]).trim();
    const pv=parseFloat(String(row[pi]==null?'':row[pi]).replace(/[^0-9.\-]/g,''));
    if(!nm||isNaN(pv)||/品名|名稱|商品|合計|總計/.test(nm))continue;
    const na=pv<=0;if(na)zero++;
    out.push({name:nm,price:na?0:pv,unit:ui>=0?String(row[ui]||'').trim():'',memo:'',na});}
  return{items:out,period:null,zero};}
function decodeSmart(buf){let t=new TextDecoder('utf-8').decode(buf);

function normName(s){return String(s).replace(/[\s　]/g,'').replace(/[（(].*?[)）]/g,'');}
// 完全一樣才算「對到」；只是名字有包含關係（例：加工紅蘿蔔絲 vs 紅蘿蔔）只能當「猜的」，一定要人確認，

function matchExact(name,list){let m=list.find(p=>p.name===name);if(m)return m.id;

function verifyReport(res){

         ${diff.map(d=>`<tr><td>${esc(d.it.name)}<div class="muted" style="font-size:11px">系統：${nm(d.pid)}</div></td>
           <td class="right"><b>$${fmt(d.sys)}</b></td><td class="right"><b style="color:#B04A32">$${fmt(d.file)}</b></td></tr>`).join('')}</tbody></table>`):''}
      ${noSys.length?box(`⚠️ 檔案有價、系統沒登錄（${noSys.length}）`,'#7C6015',
        `<div class="muted" style="font-size:12.5px;line-height:1.9">${noSys.map(d=>esc(d.it.name)+' $'+fmt(d.it.na?0:d.it.price)).join('、')}<br><br>代表這幾筆上傳時沒進去，請重新上傳一次。</div>`):''}

        `<div class="muted" style="font-size:12.5px;line-height:1.9">${stale.map(d=>esc(d.p.name)+' $'+fmt(d.sys)).join('、')}<br><br>可能是上一週留下來的價格，確認一下是不是該清掉。</div>`):''}

      ${same.length?box(`✅ 一致（${same.length}）`,'#2F6B4F',

let verifyRes=null;

function handleParsed(res){
  if(impMode==='verify')return verifyReport(res);
  const items=res.items||[];
  if(!items.length){toast('讀不到品名與價格，請確認檔案格式');return;}
  // 檔案上有期間 → 自動切到該週期
  let noteP='';
  if(res.period){const ws=weekStartTue(res.period.start);
    if(ws!==wkWeek){wkWeek=ws;noteP=`<div style="background:var(--green-soft);color:var(--green);padding:9px 13px;border-radius:10px;font-size:12.5px;margin-bottom:12px">
      📅 偵測到報價單期間 <b>${res.period.start} ～ ${res.period.end}</b>，已自動套用到這個週期。</div>`;}}
  importRows=items;const list=impList();
  const gOK=[],gNew=[],gNA=[];let unitChg=0;
  items.forEach((it,i)=>{const r=resolvePid(it.name,list);
    it._skip=r.skip; it._pid=r.pid; it._sure=r.sure;
    const cur=(it._pid&&it._sure)?list.find(p=>p.id===it._pid):null;
    if(cur&&usableUnit(it.unit)&&!sameUnit(cur.unit,it.unit))unitChg++;
    if(it.na)gNA.push(i); else if(it._pid&&it._sure)gOK.push(i); else gNew.push(i);});
  // 兩筆以上對到同一個商品（例：冷凍玉米筍 (切段) 和 (整條)）→ 全部降級成要人確認，不然後面那筆會蓋掉前面的價格
  const cnt={};items.forEach(it=>{if(it._pid&&it._sure)cnt[it._pid]=(cnt[it._pid]||0)+1;});
  items.forEach((it,i)=>{if(it._pid&&it._sure&&cnt[it._pid]>1){it._sure=false;it._dupe=true;
    const k=gOK.indexOf(i);if(k>=0){gOK.splice(k,1);if(!it.na)gNew.push(i);}}});
  gNew.sort((a,b)=>a-b);
  const hit={};items.forEach(it=>{if(it._pid)hit[it._pid]=1;});
  const absent=list.filter(p=>!hit[p.id]);
  openModal(`<h3>確認 ${esc(wkSup)} 本週價目表</h3>
    ${noteP}
    <div class="muted" style="font-size:12.5px;margin-bottom:12px;line-height:1.7">
      共讀到 <b style="color:var(--ink)">${items.length}</b> 筆，套用到
      <b style="color:var(--ink)">${mmdd(wkWeek)}（三）～ ${mmdd(weekEndOf(wkWeek))}</b>。<br>
      <b style="color:#7C6015">這一週的價格會整份換成這份檔案</b>——廠商每週給的就是最新的，以檔案為準。</div>
    <div style="max-height:50vh;overflow:auto;background:#F4F4F1;padding:10px;border-radius:12px">
      ${impSect('✅','已對到現有商品','var(--green)',gOK,false,'價格會直接更新。對錯了的話按「改」重選。')}
      ${impSect('⚠️','找不到對應的商品','#7C6015',gNew,true,'請幫這幾筆選一次；選過之後系統會記住，下週上傳就自動對上。')}
      ${impSect('🚫','本週無供應（單價 0）','#B04A32',gNA,true,'這些品項這一週不能加入購物車，避免叫到沒有的貨。')}
      ${absent.length?`<details style="background:#fff;border-radius:12px;overflow:hidden">
        <summary style="padding:11px 14px;font-weight:700;cursor:pointer;border-left:5px solid #B8B8B2">○ 這週價目表上沒出現（${absent.length}）</summary>
        <div class="muted" style="padding:10px 14px;line-height:1.9;font-size:12.5px">${absent.map(p=>esc(p.name)).join('、')}<br><br>這些會顯示「本週未報價」，需要的話可以到本週菜價自己補價格。</div></details>`:''}
    </div>
    ${unitChg?`<label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-size:13px;cursor:pointer">
      <input type="checkbox" id="impUnit" checked style="width:17px;height:17px"> 同時把 ${unitChg} 項商品的單位改成價目表上的單位</label>`:''}
    <div class="modact"><button class="btn grey" onclick="openImport()">‹ 重選檔案</button><button class="btn" onclick="applyImport()">確認登錄</button></div>`,true);}
function applyImport(){let n=0,created=0,uch=0,na=0,skipped=0;

  document.querySelectorAll('[data-imp]').forEach(sel=>rec.push([+sel.dataset.imp,sel.value]));
  const dupe={},bad=[];
  rec.forEach(([i,v])=>{if(v==='__skip'||v==='__new')return;
    if(dupe[v]){bad.push(importRows[dupe[v]].name+'、'+importRows[i].name);}else dupe[v]=i;});
  if(bad.length){toast('「'+bad[0]+'」對到同一個商品，價格會蓋掉，請先改一下');return;}
  // 這一週這家廠商的價格整份換成檔案上的，避免上次殘留的舊價混在裡面
  let wiped=0;
  Object.keys(weekly).forEach(k=>{if(k.indexOf(wkSup+'|'+wkWeek+'|')===0){delete weekly[k];wiped++;}});
  rec.forEach(([i,v])=>{const it=importRows[i];if(!it)return;
    if(v==='__skip'){wkAlias[aliasKey(wkSup,it.name)]='__skip';skipped++;return;}
    let pid=v;
    if(v==='__new'){pid='x'+Date.now().toString(36)+'_'+i;
      products.push({id:pid,name:it.name,spec:usableUnit(it.unit)?'':(it.unit||''),unit:usableUnit(it.unit)?it.unit:'包',supplier:wkSup,cat:'蔬果',price:0});created++;}
    else if(uOn&&usableUnit(it.unit)){const pr=products.find(p=>p.id===pid);if(pr&&!sameUnit(pr.unit,it.unit)){pr.unit=it.unit;uch++;}}
    wkAlias[aliasKey(wkSup,it.name)]=pid;
    weekly[`${wkSup}|${wkWeek}|${pid}`]=it.na?0:it.price;
    if(it.na)na++;else n++;});
  persist();hideModal();
  toast(`已登錄 ${n} 筆價格${na?`・${na} 項本週無供應`:''}${created?`・新增 ${created} 項`:''}${uch?`・改了 ${uch} 個單位`:''} ✓`);
  render();setTimeout(()=>showPriceChanges(wkSup,wkWeek),350);}
function saveWeekly(){document.querySelectorAll('[data-wk]').forEach(i=>{const k=`${wkSup}|${wkWeek}|${i.dataset.wk}`;

  if(v===null||isNaN(v))delete weekly[k];else weekly[k]=v;});

// 單價含稅／未稅即時換算：不管廠商怎麼報，都幫你算好，不用自己按計算機
function pBasisNow(){const r=document.querySelector('input[name="pBasis"]:checked');return r?r.value:'含稅';}
function pSupNow(){const e=document.getElementById('pSup');return e?e.value:'';}
function pStoredPrice(){const v=parseFloat((document.getElementById('pPrice')||{}).value)||0;

function pTaxCalc(){const h=document.getElementById('pTaxHint');if(!h)return;
  const v=parseFloat((document.getElementById('pPrice')||{}).value)||0;
  const b=pBasisNow(),sup=pSupNow(),sb=supTax(sup);

  const incl=b==='含稅'?Math.round(v*100)/100:toIncl(v);
  const excl=b==='含稅'?toExcl(v):Math.round(v*100)/100;
  const stored=pStoredPrice();
  h.innerHTML=`未稅 <b>$${fmt2(excl)}</b>　／　含稅 <b>$${fmt2(incl)}</b>（稅額 $${fmt2(Math.round((incl-excl)*100)/100)}）

/* ===== 一種商品兩種叫法（台斤／件），1 件 = 30 台斤 =====
   菜類單位一律台斤（Nina：「我們菜類的單位沒有公斤的單位 都是台斤」） */
const ALT_SET={'油菜':30,'青江菜':30,'鵝白菜':30,'山東白菜':30,'櫛瓜':30,'高麗菜':30,'空心菜':30};
function migrateAltUnits(){let n=0;
  products.forEach(p=>{
    if(p.supplier!=='源發禾鮮商行')return;
    const f=ALT_SET[p.name];if(!f)return;
    if(['件','箱','公斤'].includes(p.unit)){p.unit='台斤';n++;}   // 菜類單位一律台斤
    if(!('alt' in p)&&p.unit==='台斤'){p.alt={u:'件',f};n++;}     // 她自己關掉的（alt.f=0）不會被加回來
  });
  return n;}
/* 從 CocoMart 兩間店匯進來時，有兩筆重複：規格欄只是把單位再抄一次
   （紅K絲 規格「台斤」、杏鮑菇/D 規格「袋」）。同名同單位同價，留一筆就好，
   不然叫貨畫面會出現兩個一模一樣的東西，價格也只會落在其中一筆。 */
const UNITWORD=['袋','台斤','斤','公斤','包','箱','件','盒','瓶','把','板','顆','根','粒','桶','罐'];
function dedupeProducts(){const kill=[];
  products.forEach(p=>{
    if(!p.spec||!UNITWORD.includes(String(p.spec).trim()))return;
    // 同名的另一筆，規格不是「單純把單位再抄一次」的那一筆才是正本
    const twin=products.find(q=>q!==p&&q.supplier===p.supplier&&q.name===p.name
      &&!UNITWORD.includes(String(q.spec||'').trim()));
    if(twin)kill.push([p,twin]);});
  if(!kill.length)return 0;
  kill.forEach(([dead,keep])=>{
    // 這一筆身上如果有本週價，搬到留下來的那一筆，不要弄丟
    Object.keys(weekly).forEach(k=>{const parts=k.split('|');
      if(parts[2]===dead.id){const nk=parts[0]+'|'+parts[1]+'|'+keep.id;
        if(weekly[nk]==null)weekly[nk]=weekly[k];delete weekly[k];}});
    Object.keys(favs).forEach(k=>{if(k.endsWith('|'+dead.id))delete favs[k];});
    Object.keys(cart).forEach(k=>{if(k===dead.id)delete cart[k];});
    products=products.filter(x=>x!==dead);});
  return kill.length;}
function altOf(p){return (p&&p.alt&&p.alt.u&&p.alt.f>0)?p.alt:null;}
function usingAlt(pid){return !!cartUnit[pid];}
function unitOf(p){return usingAlt(p.id)&&altOf(p)?p.alt.u:p.unit;}
function factorOf(p){return usingAlt(p.id)&&altOf(p)?p.alt.f:1;}

  return `<span class="unitsw"><button class="${on?'':'on'}" onclick="setUnitMode('${p.id}',false)">${esc(p.unit)}</button><button class="${on?'on':''}" onclick="setUnitMode('${p.id}',true)">${esc(a.u)}</button></span>`;}

// 送完單自動通知廠商；發不出去的才需要妳手動處理
async function afterSubmit(nos){
  const list=nos.map(n=>orders.find(o=>o.no===n)).filter(Boolean);
  if(!list.length)return;
  const auto=lineReady()&&lineCfg.on!==false;
  const rows=[];
  for(const o of list){
    let st='off',msg='';
    if(auto){
      const to=lineTargetOf(o.supplier);
      if(!to){st='nogroup';msg='還沒填 LINE 群組 ID';}
      else if(!lineIdOk(to)){st='badid';msg=`群組 ID 格式不對，存的是「${to}」（${to.length} 個字）。正確的是 C 開頭再接 32 個英數字，請到「廠商管理 → ${o.supplier}」重貼一次。`;}
      else if(lineUsed()>=lineQuota()){st='quota';msg='本月額度用完了';}
      else{try{await lineSendOrder(o.no);st='ok';}catch(e){st='fail';msg=e.message||'發送失敗';}}
    }
    rows.push({o,st,msg});
  }
  const okN=rows.filter(r=>r.st==='ok').length;
  const tag={ok:'<span class="pill done">✓ 已通知</span>',fail:'<span class="pill" style="background:#F8EAE6;color:#B04A32">發送失敗</span>',
    nogroup:'<span class="pill wait">沒有群組</span>',badid:'<span class="pill" style="background:#F8EAE6;color:#B04A32">群組 ID 有問題</span>',quota:'<span class="pill" style="background:#F8EAE6;color:#B04A32">額度用完</span>',
    off:'<span class="pill wait">未啟用自動</span>'};
  openModal(`<h3>訂單送出了 ✓</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:14px;line-height:1.7">共 ${list.length} 張叫貨單${auto?`，已自動通知 <b style="color:var(--green)">${okN}</b> 家`:''}。${auto?`<br>本月已用 ${lineUsed()} / ${lineQuota()} 則。`:'<br>還沒設定自動通知，可以先手動傳。'}</div>
    ${rows.map(({o,st,msg})=>`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--line)">
      <div style="flex:1 1 170px;min-width:0"><b>${esc(o.supplier)}</b> ${tag[st]}
        <div class="muted" style="font-size:12px">${o.no}　${(o.items||[]).length} 項　到貨 ${mmdd(o.deliveryDate)}${msg?`　·　<span style="color:#B04A32">${esc(msg)}</span>`:''}</div></div>
      ${st==='ok'?'':`<button class="btn line mini" onclick="openLineShare('${o.no}')">📤 手動傳</button>`}</div>`).join('')}
    <div class="modact">${auto?'':`<button class="btn grey mini" onclick="openLineSetup()" style="margin-right:auto">設定自動通知</button>`}<button class="btn" onclick="hideModal()">關閉</button></div>`,true);}
/* ===== LINE 自動通知 =====
   權杖在妳自己的 Apps Script 裡，這邊只存中繼網址與通關密語，而且存在 Firebase（要登入才讀得到），
   不會出現在公開的網頁原始碼。 */
let lineCfg=load('p_linecfg')||{url:'',secret:'',on:true,quota:200};
let lineUsage=load('p_lineusage')||{};      // {'2026-08': 則數}
function lineMonth(){return isoAt(0).slice(0,7);}
function lineUsed(){return Number(lineUsage[lineMonth()]||0);}
function lineQuota(){return Number(lineCfg.quota||200);}
function lineReady(){return !!(lineCfg.url&&lineCfg.secret);}
/* 群組 ID 常常會連旁邊的字一起被複製到（換行、空白、群組名稱…），LINE 收到就會回 400。
   這裡直接把那一長串 ID 撈出來，撈不到才退而求其次把非英數字都拿掉。 */
function cleanLineId(s){const t=String(s||'');
  const m=t.match(/[CURcur][0-9a-fA-F]{32}/);
  if(m)return m[0];
  return t.replace(/[^A-Za-z0-9]/g,'');}
function lineIdOk(s){return /^[CURcur][0-9a-fA-F]{32}$/.test(cleanLineId(s));}
function migrateLineIds(){let n=0;suppliers.forEach(s=>{if(!s.lineTo)return;
  const c=cleanLineId(s.lineTo);if(c&&c!==s.lineTo){s.lineTo=c;n++;}});return n;}
function lineTargetOf(sup){const x=suppliers.find(y=>y.name===sup);return cleanLineId(x&&x.lineTo);}
function lineSizeOf(sup){const x=suppliers.find(y=>y.name===sup);return Math.max(1,Number(x&&x.lineSize)||1);}
function cloudPushLine(){ if(CLOUD_ON&&window.CLOUD){CLOUD.set(SH('line'),lineCfg);CLOUD.set(SH('lineUsage'),lineUsage);} }
function bumpUsage(n){const m=lineMonth();lineUsage[m]=lineUsed()+n;persistLocal();cloudPushLine();}
/* Content-Type 用預設的 text/plain，才不會觸發 preflight（Apps Script 不處理 OPTIONS） */
async function lineSend(to,text){
  if(!lineReady())throw new Error('還沒設定 LINE 中繼');
  const r=await fetch(lineCfg.url,{method:'POST',body:JSON.stringify({secret:lineCfg.secret,to,text})});
  let j=null; try{j=await r.json();}catch(e){}
  if(!j||!j.ok)throw new Error((j&&j.error)||('中繼沒有回應（HTTP '+r.status+'）'));
  return j;}   // j.count = LINE 那邊回報的實際收訊人數
async function lineSendOrder(no){
  const o=orders.find(x=>x.no===no); if(!o)throw new Error('找不到訂單');
  const to=lineTargetOf(o.supplier);
  if(!to)throw new Error(o.supplier+' 還沒填 LINE 群組 ID');
  if(!lineIdOk(to))throw new Error(o.supplier+' 的群組 ID 格式不對：「'+to+'」（'+to.length+' 個字）');
  const j=await lineSend(to,orderMsg(o));
  o.lineSentAt=new Date().toISOString().slice(0,16).replace('T',' ');
  // 人數以 LINE 現場回報的為準，抓不到才用廠商設定裡填的
  const n=Number(j&&j.count)>0?Number(j.count):lineSizeOf(o.supplier);
  o.lineCount=n;
  const sup=suppliers.find(x=>x.name===o.supplier);
  if(sup&&Number(j&&j.count)>0&&Number(sup.lineSize)!==n){sup.lineSize=n;cloudPushShared();}
  cloudSaveOrder(o); bumpUsage(n); persistLocal();
  return true;}
function lineDate(iso){return iso?`${+iso.split('-')[1]}/${+iso.split('-')[2]}（${weekday(iso)}）`:'';}
/* 時價廠商（週報／隨貨）不帶價格——價格本來就是他們報的 */
/* 底線後面是我們自己記的備註（例：康寶香甜沙拉(整箱出)_客訂要等/不可退換），
   廠商看了只會困惑，發出去之前拿掉 */
function lineName(s){const t=String(s||'');const i=t.indexOf('_');
  if(i>0){const h=t.slice(0,i).trim();if(h)return h;}
  return t;}
/* 品名一行、數量一行。品名再長也不會把數字擠爛，數字永遠對齊在左邊 */
/* 帶不帶價格，看的是「這張單上有沒有價」，不是廠商分類：
   興裕（週報）已經把價目表給我們了 → 照他們的報價寫出來，群裡有白紙黑字好對帳；
   源發禾鮮（隨貨）收貨當天才知道價 → 只寫品名數量。 */
function orderMsg(o){
  const items=o.items||[];
  const allPriced=items.length>0&&items.every(i=>i.price!=null);
  const spot=supPricing(o.supplier)!=='固定';
  const lines=items.map(i=>{
    let q=`　${i.qty} ${i.unit}`;
    if(i.baseQty)q+=`（${fmt(i.baseQty)} ${i.baseUnit}）`;
    if(i.price!=null){
      q+=`　$${fmt(i.price)}`;
      if(Number(i.qty)!==1)q+=`　＝$${fmt(i.price*i.qty)}`;
    }
    return `${lineName(i.name)}\n${q}`;});
  let t=`${BRAND}　${o.storeName||curStoreName()}\n${lineDate(o.deliveryDate)}到貨　${o.no}\n\n`+lines.join('\n');
  let tail=false;
  if(allPriced){
    t+=`\n\n合計 $${fmt(orderTotal(o))}`;
    if(spot){
      /* 註明是哪一週的報價表，日後對帳一看就知道依據 */
      const ws=weekStartTue(o.date||isoAt(0));
      t+=supPricing(o.supplier)==='週報'
        ? `\n（單價取自貴公司 ${mmdd(ws)}～${mmdd(weekEndOf(ws))} 報價表）`
        : '\n（單價取自貴公司報價）';
    }
    tail=true;
  }else if(items.length){
    t+='\n\n（單價依貴公司當日／本週報價）';tail=true;
  }
  t+=(tail?'\n':'\n\n')+'麻煩您了，謝謝！';
  return t;}

async function lineTest(){
  const url=(document.getElementById('lnUrl')||{}).value.trim(),sec=(document.getElementById('lnSec')||{}).value.trim();
  if(!url||!sec){toast('請先填網址與通關密語');return;}
  toast('測試中…');
  try{
    const r=await fetch(url,{method:'POST',body:JSON.stringify({secret:sec,action:'list'})});
    const j=await r.json();
    if(!j.ok){toast('連得到，但被拒絕：'+(j.error||'?'));return;}
    const g=j.groups||[];
    openModal(`<h3>連線成功 ✓</h3>
      <div class="muted" style="font-size:13px;margin-bottom:12px">中繼有回應，通關密語正確。目前記錄到 ${g.length} 個群組：</div>
      ${g.length?g.map(x=>`<div style="padding:11px 13px;background:#F4F4F1;border-radius:11px;margin-bottom:9px">
        <b style="font-size:13.5px">${esc(x.name||'（讀不到名稱）')}</b>

function ordPhoto(no,input){const fl=input.files&&input.files[0];if(!fl)return;
  toast('照片處理中…');
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();
    img.onload=()=>{const max=1400;let w=img.width,h=img.height;
      if(w>max||h>max){const sc=max/Math.max(w,h);w=Math.round(w*sc);h=Math.round(h*sc);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const o=orders.find(x=>x.no===no);if(!o)return;
      o.photo=c.toDataURL('image/jpeg',0.6);
      cloudSaveOrder(o);persist();toast('貨單照片已附上 ✓');render();};
    img.onerror=()=>toast('這張圖讀不到，換一張試試');
    img.src=e.target.result;};
  rd.readAsDataURL(fl);}
function delOrdPhoto(no){const o=orders.find(x=>x.no===no);if(!o)return;
  delete o.photo;cloudSaveOrder(o);persist();render();}
function viewOrderPhoto(no){const o=orders.find(x=>x.no===no);if(!o||!o.photo)return;
  openModal(`<h3>${o.no}　貨單照片</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:10px">${esc(o.supplier)}　${o.receivedAt?'貨單日期 '+mmdd(o.receivedAt):'尚未收貨'}</div>

function receive(no){const o=orders.find(x=>x.no===no);if(!o)return;
  if(!o.photo&&!confirm('還沒拍貨單照片。\n月底對帳會少一張憑證，確定要直接確認收貨嗎？'))return;
  let missing=false;
  // 時價品項：照貨單填實收數量、單位、單價
  document.querySelectorAll(`[data-iq^="${no}|"]`).forEach(inp=>{const idx=+inp.dataset.iq.split('|')[1];
    const q=parseFloat(inp.value);if(!isNaN(q)&&q>=0)o.items[idx].qty=q;});
  document.querySelectorAll(`[data-iu^="${no}|"]`).forEach(inp=>{const idx=+inp.dataset.iu.split('|')[1];
    const u=String(inp.value||'').trim();if(u)o.items[idx].unit=u;});
  document.querySelectorAll(`[data-ip^="${no}|"]`).forEach(inp=>{const idx=+inp.dataset.ip.split('|')[1];
    const v=parseFloat(inp.value);if(isNaN(v)){missing=true;}else o.items[idx].price=v;});
  if(missing){toast('請先填完所有時價品項的單價');return;}
  o.items=o.items.filter(i=>Number(i.qty)>0);
  if(!o.items.length){toast('數量都填 0 的話，請改用「作廢整張單」');return;}
  const di=document.getElementById('rd_'+no);
  o.receivedAt=(di&&di.value)||isoAt(0);
  o.status='已驗收';cloudSaveOrder(o);persist();toast('已確認收貨 ✓　貨款算在 '+mmdd(o.receivedAt)+' 那一期');render();}

async function orderSeq(){
  if(CLOUD_ON&&window.CLOUD){try{const n=await CLOUD.nextSeq(SP()+'/seq',1003);seq=n;store.set('p_seq',JSON.stringify(seq));return n;}catch(e){console.warn('取號失敗，改用本機號',e);}}

/* ====== 單號：門市代碼-年月日-當天第幾張（Nina 2026-08-25 要求） ======
   例：BG1-20260825-01。五間店一起用的時候，廠商看單號就知道是哪一間。 */
function storeCode(name){const m=String(name||'').match(/[A-Za-z]{2,}\d+$/);
  if(m)return m[0].toUpperCase();
  const t=String(name||'').replace(/[^A-Za-z0-9]/g,'');
  return (t.slice(-3)||'ST').toUpperCase();}
function ymd(iso){return String(iso||'').replace(/-/g,'');}
async function newOrderNo(){
  const day=ymd(isoAt(0)),code=storeCode(curStoreName());
  let n=0;
  if(CLOUD_ON&&window.CLOUD){try{n=await CLOUD.nextSeq(SP()+'/seqDay/'+day,0);}catch(e){console.warn('取號失敗，改用本機號',e);}}
  if(!n){ // 連不到雲端時：看今天這間店已經有幾張單
    n=orders.filter(o=>o.store===selStore&&ymd(o.date)===day).length+1; }
  return code+'-'+day+'-'+pad2(n);}
/* 舊的 PO#### 一次改成新格式。用雲端 transaction 當鎖，避免兩台裝置同時改。 */
async function migrateOrderNos(){
  const old=storeOrders().filter(o=>/^PO/.test(o.no));
  if(!old.length)return 0;
  if(CLOUD_ON&&window.CLOUD){
    try{const t=await CLOUD.nextSeq(SP()+'/migrateNoV2',0); if(t!==1)return 0;}catch(e){return 0;}
  }
  const code=storeCode(curStoreName());
  const byDay={};
  old.slice().sort((a,b)=>{const na=parseInt(String(a.no).replace(/\D/g,''))||0,nb=parseInt(String(b.no).replace(/\D/g,''))||0;return na-nb;})
     .forEach(o=>{const d=ymd(o.date||isoAt(0));(byDay[d]=byDay[d]||[]).push(o);});
  const map={};
  Object.keys(byDay).forEach(d=>{
    // 那一天已經有新格式的單，序號要接在後面
    let base=storeOrders().filter(x=>ymd(x.date)===d&&!/^PO/.test(x.no)).length;
    byDay[d].forEach(o=>{base++;map[o.no]=code+'-'+d+'-'+pad2(base);});
  });
  const olds=Object.keys(map);
  olds.forEach(k=>{const o=orders.find(x=>x.no===k); if(o)o.no=map[k];});
  // 退貨單裡記的來源單號也要跟著換
  returns.forEach(r=>{if(r.refNo&&map[r.refNo]){r.refNo=map[r.refNo];cloudSaveReturn(r);}});
  if(CLOUD_ON&&window.CLOUD){
    olds.forEach(k=>{const o=orders.find(x=>x.no===map[k]); if(o)cloudSaveOrder(o); CLOUD.del(SP()+'/orders/'+encK(k));});
    // 把每天的計數推到最大值，新單才不會撞號
    Object.keys(byDay).forEach(d=>{const mx=storeOrders().filter(x=>ymd(x.date)===d).length;CLOUD.set(SP()+'/seqDay/'+d,mx);});
  }
  persistLocal();
  return olds.length;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(n){return (Math.round(n)||0).toLocaleString('en-US');}
function fmt2(n){return (Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});}
function toIncl(v){return Math.round(v*1.05*100)/100;}   // 未稅 → 含稅
function toExcl(v){return Math.round(v/1.05*100)/100;}   // 含稅 → 未稅
function pad2(n){return String(n).padStart(2,'0');}
function isoAt(add){const d=new Date();d.setDate(d.getDate()+add);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function curMonth(){const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;}
function monthOptions(sel){const d=new Date();const arr=[];for(let i=-15;i<=2;i++){const x=new Date(d.getFullYear(),d.getMonth()+i,1);arr.push(`${x.getFullYear()}-${pad2(x.getMonth()+1)}`);}
  if(sel&&!arr.includes(sel))arr.push(sel);
  return arr.sort().reverse().map(m=>{const[y,mm]=m.split('-');return `<option value="${m}" ${m===sel?'selected':''}>${y} 年 ${mm} 月</option>`;}).join('');}
function mmdd(iso){if(!iso)return'';const p=iso.split('-');return `${p[1]}/${p[2]}`;}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1700);}
/* 按鈕沒反應通常是某個地方丟了例外又被吃掉；至少讓它現形，不要讓人以為是「按不動」 */
window.addEventListener('error',e=>{try{toast('畫面出錯了：'+(e.message||'未知錯誤'));}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{toast('操作沒完成：'+((e.reason&&e.reason.message)||'未知錯誤'));}catch(_){}});
migrateAltUnits();
purgeOldAlias();
dedupeProducts();
migrateLineIds();
render();

</script>
