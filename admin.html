/* 登入閘門 */

#gate.hide{display:none}

.gbox h2{margin:2px 0 4px;text-align:center;font-size:20px}
.gmark{text-align:center;font-weight:800;letter-spacing:6px;font-size:14px;color:var(--muted)}
.gsub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.gerr{background:var(--red-soft);border-left:4px solid var(--red);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.gspin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;margin:10px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.top{background:#3D3D3D;color:#F2F2F0;padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:4px;font-size:13px}
.logo b{letter-spacing:0;font-size:15px;margin-left:10px}
.top .sp{margin-left:auto}
.who{font-size:12.5px;opacity:.75}
.live{background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;letter-spacing:1px}

.shell{display:grid;grid-template-columns:212px 1fr;gap:22px;max-width:1240px;margin:0 auto;padding:22px 20px 70px;align-items:start}
.side{position:sticky;top:22px}
.nav{background:#3D3D3D;border-radius:16px;padding:9px;margin-bottom:14px}
.nav button{display:block;width:100%;text-align:left;background:none;border:none;color:#C8C8C4;
 padding:10px 14px;border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.nav button.on{background:var(--panel);color:var(--ink)}
.sideinfo{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--muted);font-size:12px;line-height:1.8}
.sideinfo b{color:var(--ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
h1{font-size:23px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3{font-size:13px;margin:20px 0 8px;color:var(--muted);letter-spacing:1.5px}
.sub{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:11.5px;font-weight:800;letter-spacing:1px}
td.r,th.r{text-align:right;white-space:nowrap}
tr.row{cursor:pointer} tr.row:hover{background:var(--panel2)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--green-soft);color:#1F4A36}
.p-warn{background:var(--warn-soft);color:var(--warn)}

.p-off{background:#E6E6E1;color:#6E6E68}
.p-trial{background:var(--blue-soft);color:var(--blue)}
.p-pink{background:#F6E6EB;color:#8A5566}
.btn{background:var(--ink);color:#F6F6F4;border:none;padding:10px 18px;border-radius:99px;font-size:13.5px;

.btn:disabled{opacity:.5;cursor:default}

.btn.g{background:#EDEDEA;color:var(--ink);border:1px solid var(--line)}

.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

input,select,textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* 開通進度 */

.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}

.progbar i{display:block;height:100%;background:var(--green);border-radius:99px}

/* 每月訂單量 */
.chart{margin-top:6px;position:relative}
.chart .plot{display:flex;align-items:flex-end;gap:2px;height:104px;padding-top:16px;position:relative}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10px;color:#A5A59F;padding-left:1px}
.bwrap{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.bar{background:var(--bar);border-radius:4px 4px 0 0;width:100%;transition:background .12s}
.bwrap.hi .bar{background:var(--bar-hi)}
.bwrap:hover .bar{background:var(--pink)}
.blab{position:absolute;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;white-space:nowrap;color:var(--ink)}
.xax{display:flex;gap:2px;margin-top:6px}
.xax span{flex:1 1 0;text-align:center;font-size:10.5px;color:var(--muted)}
.xax span.hi{color:var(--ink);font-weight:800}
.tip{position:absolute;background:#3D3D3D;color:#F2F2F0;font-size:11.5px;padding:5px 10px;border-radius:8px;
 pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;transform:translate(-50%,-100%);z-index:5}
.tip.on{opacity:1}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static}
  .nav{display:flex;gap:6px;overflow-x:auto}
  .nav button{white-space:nowrap}
  .two,.three{grid-template-columns:1fr}
  .scroll{overflow-x:auto}
}

         setPersistence, browserLocalPersistence, sendPasswordResetEmail,

const cfg={apiKey:"AIzaSyA97V0-UtVt6KLHkjZSlKNtDZzcyFUeuRo",authDomain:"jianren-order.firebaseapp.com",databaseURL:"https://jianren-order-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"jianren-order",storageBucket:"jianren-order.firebasestorage.app",messagingSenderId:"148202708351",appId:"1:148202708351:web:692464c6574b8a87a78e4a"};
const app=initializeApp(cfg,'admin'), auth=getAuth(app), db=getDatabase(app);
window.DB={
  async login(e,p){ await setPersistence(auth,browserLocalPersistence);
    return (await signInWithEmailAndPassword(auth,e,p)).user; },
  logout(){ return signOut(auth); },
  onAuth(cb){ onAuthStateChanged(auth,cb); },

  reset(e){ return sendPasswordResetEmail(auth,e); },
  /* 建立登入帳號。
     - 用「第二條連線」建，所以不會把 Nina 從後台踢出去

  async createUser(email){

<script>
const VER='2026-09-04b';
const EK = e => String(e||'').replace(/\./g,',').replace(/@/g,',');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(Number(n||0)*100)/100).toLocaleString('zh-TW');
const today = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);

let ME=null, IS_ADMIN=false;
let TENANTS={};       // tenantId -> { acl, meta, stores:{id:{name,orders,items,amount,last}}, products, suppliers, monthly }
let CUR=null;         // 目前看的客戶 id

/* 開通進度的固定 8 步 */
const STEPS=[
 ['company','建立公司與品牌'],
 ['stores','建立門市'],
 ['import','匯入商品與廠商'],
 ['accounts','建立登入帳號'],
 ['line','設定 LINE 官方帳號與廠商群組'],
 ['firstorder','第一張訂單成功送出'],
 ['training','教育訓練（每間門市至少 1 人）'],
 ['allstores','每間門市都送出過訂單']
];

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------------- 登入閘門 ---------------- */
function renderGate(step,msg){
  const b=document.getElementById('gateBody'); if(!b)return;
  if(step==='loading'){ b.innerHTML='<div class="gspin"></div><div class="gsub" style="margin-top:14px">連線中…</div>'; return; }
  if(step==='login'){
    b.innerHTML=`<div class="gmark">2 A M　S H O P P I N G</div>
      <h2>管理後台</h2>
      <div class="gsub">只有 2AM 的管理員能進來</div>
      ${msg?`<div class="gerr">${esc(msg)}</div>`:''}
      <div class="fld"><label>信箱</label><input id="aEmail" type="email" autocomplete="username" value="${esc(localStorage.getItem('adm_email')||'')}"></div>
      <div class="fld"><label>密碼</label><input id="aPw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn" id="aBtn" style="width:100%" onclick="doLogin()">登入</button>`;
    setTimeout(()=>{const el=document.getElementById(localStorage.getItem('adm_email')?'aPw':'aEmail');el&&el.focus();},100); return; }
  if(step==='notadmin'){
    b.innerHTML=`<h2>這個帳號沒有後台權限</h2>
      <div class="gerr">${esc((ME&&ME.email)||'')} 不在管理員名單裡。<br>後台只開放給 2AM 的管理員。</div>
      <button class="btn g" style="width:100%" onclick="doLogout()">換一個帳號</button>`; return; }
  if(step==='error'){
    b.innerHTML=`<h2>讀取失敗</h2><div class="gerr">${esc(msg)}</div>
      <button class="btn" style="width:100%" onclick="location.reload()">重新整理</button>`; return; }
}
window.doLogin=async function(){
  const e=(document.getElementById('aEmail')||{}).value||'', p=(document.getElementById('aPw')||{}).value||'';
  if(!e.trim()||!p){ renderGate('login','請填信箱和密碼'); return; }
  const b=document.getElementById('aBtn'); if(b){b.disabled=true;b.textContent='登入中…';}
  try{ await DB.login(e.trim(),p); localStorage.setItem('adm_email',e.trim()); }
  catch(err){ const c=(err&&err.code)||'';
    renderGate('login', c.includes('wrong-password')||c.includes('invalid-credential')?'密碼不對':
      c.includes('user-not-found')?'查無這個帳號':
      c.includes('too-many-requests')?'嘗試太多次，等一下再試':'登入失敗：'+c); }
};
window.doLogout=async function(){ try{ await DB.logout(); }catch(e){} location.reload(); };

/* ---------------- 讀資料 ---------------- */
async function loadAll(){
  const tRoot = await DB.read('tenants') || {};
  TENANTS={};
  for(const id of Object.keys(tRoot)){
    const t = tRoot[id] || {};
    const acl = t.acl || {};
    const meta = t.meta || {};
    const shared = t.shared || {};
    const orderRoot = t.order || {};
    const stores={}; let allOrders=[];
    Object.keys(orderRoot).forEach(sid=>{
      const os = (orderRoot[sid]||{}).orders || {};
      const list = Object.keys(os).map(k=>os[k]).filter(Boolean);
      let items=0, amount=0, last='';
      list.forEach(o=>{
        if(o.status!=='已作廢'){
          (o.items||[]).forEach(i=>{ items++; if(i.price!=null) amount+=Number(i.price)*Number(i.qty||0); });
        }
        if(o.date && o.date>last) last=o.date;
      });
      const nameFromOrders = (list.find(o=>o.storeName)||{}).storeName || '';
      const metaName = ((meta.stores||{})[sid]||{}).name || '';
      stores[sid]={ id:sid, name: metaName || nameFromOrders || sid,
                    orders:list.length, items, amount, last,
                    returns:Object.keys((orderRoot[sid]||{}).returns||{}).length };
      allOrders=allOrders.concat(list);
    });
    // meta 裡登記但還沒有訂單的門市也要列出來
    Object.keys(meta.stores||{}).forEach(sid=>{
      if(!stores[sid]) stores[sid]={ id:sid, name:(meta.stores[sid].name||sid), orders:0, items:0, amount:0, last:'', returns:0 };
    });
    // 每月訂單量（近 12 個月）
    const monthly=[]; const now=new Date();
    for(let k=11;k>=0;k--){
      const d=new Date(now.getFullYear(), now.getMonth()-k, 1);
      const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      monthly.push({ key, label:(d.getMonth()+1)+'月', year:d.getFullYear(),
        v: allOrders.filter(o=>String(o.date||'').slice(0,7)===key).length });
    }
    TENANTS[id]={ id, acl, meta, stores, monthly,
      products: Object.keys(shared.products||{}).length,
      suppliers: (shared.suppliers||[]).length || Object.keys(shared.suppliers||{}).length,
      weekly: Object.keys(shared.weekly||{}).length,
      totalOrders: allOrders.length,
      lineCfg: shared.line || null };
  }
  if(!CUR) CUR = Object.keys(TENANTS)[0] || null;
}

};

function contractState(m){
  const e=(m.contract||{}).end;
  if(!e) return {pill:'<span class="pill p-off">未設定</span>', days:null};
  const d=daysBetween(today(),e);
  if(d<0) return {pill:'<span class="pill p-bad">已到期 '+(-d)+' 天</span>', days:d};
  if(d<=30) return {pill:'<span class="pill p-warn">'+d+' 天後到期</span>', days:d};
  return {pill:'<span class="pill p-ok">使用中</span>', days:d};
}
function payState(m){
  const p=m.payment||{};
  if(p.status==='paid') return '<span class="pill p-ok">✓ 已收</span>'+(p.date?'<div class="note">'+esc(p.date)+'</div>':'');
  if(p.status==='partial') return '<span class="pill p-warn">部分收款</span>';
  if(p.status==='none'||!p.status) return '<span class="pill p-off">未收款</span>';
  return '<span class="pill p-off">—</span>';
}
function doneCount(m){ const d=(m.onboarding||{}); return STEPS.filter(s=>d[s[0]]).length; }

window.toggleStep=async function(k){
  const T=TENANTS[CUR]; const cur=(T.meta.onboarding||{})[k];
  const val = cur ? null : today();
  try{
    await DB.update('tenants/'+CUR+'/meta/onboarding', {[k]: val});
    T.meta.onboarding = T.meta.onboarding||{};
    if(val) T.meta.onboarding[k]=val; else delete T.meta.onboarding[k];
    renderDetail(); toast(val?'已打勾':'已取消');
  }catch(e){ toast('存不進去：'+(e.message||e)); }
};

window.saveMeta=async function(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const sids=Object.keys(TENANTS[CUR].stores);
  const payload={
    company:g('f_company'), brand:g('f_brand'), contact:g('f_contact'), phone:g('f_phone'),
    contract:{ start:g('f_start'), end:g('f_end'),
               fee: g('f_fee')!=='' ? Number(g('f_fee')) : (11400+Math.max(0,sids.length-1)*1500) },
    payment:{ status:g('f_pstatus'), date:g('f_pdate'),
              amount: g('f_pamt')!=='' ? Number(g('f_pamt')) : null, note:g('f_pnote') },
    invoice:{ type:g('f_ivtype'), title:g('f_ivtitle'), taxid:g('f_ivtax'), email:g('f_ivmail') },
    updatedAt: new Date().toISOString()
  };
  const b=document.getElementById('saveBtn'); if(b){b.disabled=true;b.textContent='儲存中…';}
  try{
    await DB.update('tenants/'+CUR+'/meta', payload);
    Object.assign(TENANTS[CUR].meta, payload);
    toast('已儲存'); document.getElementById('saveHint').textContent='最後儲存 '+new Date().toLocaleString('zh-TW');
  }catch(e){ toast('存不進去：'+(e.message||e)); }
  if(b){b.disabled=false;b.textContent='儲存';}
};

function keyToEmail(key){
  const parts=String(key).split(',');
  if(parts.length<3) return '';
  const tld=parts.pop(), domain=parts.pop(), local=parts.join('.');
  return local+'@'+domain+'.'+tld;
}
/* 不用 confirm()（會凍住瀏覽器）：按第一次變成「再按一次」，5 秒沒動作就還原 */
window.sendReset=async function(key,btn){
  const email=keyToEmail(key);
  if(!email){ toast('這個鍵值看不出信箱，請手動處理'); return; }
  if(btn && btn.dataset.armed!=='1'){
    btn.dataset.armed='1'; btn.textContent='再按一次 → 寄給 '+email; btn.className='btn o mini';
    clearTimeout(btn._t); btn._t=setTimeout(()=>{ btn.dataset.armed='0';
      btn.textContent='寄設定密碼信'; btn.className='btn g mini'; },5000);
    return;
  }
  if(btn){ btn.disabled=true; btn.textContent='寄送中…'; }
  try{ await DB.reset(email); toast('已寄出到 '+email); }
  catch(e){ toast('寄不出去：'+((e&&e.code)||e.message||e)); }
  if(btn){ btn.disabled=false; btn.dataset.armed='0'; btn.textContent='寄設定密碼信'; btn.className='btn g mini'; }
};


/* ---------------- 品牌與門市 ---------------- */
function storeTable(ids){
  const T=TENANTS[CUR], m=T.meta||{};
  return `<div class="scroll"><table>
    <tr><th>門市</th><th>代號</th><th class="r">訂單</th><th>最後叫貨</th><th>專屬帳號</th><th>狀態</th></tr>
    ${ids.map(sid=>{ const s=T.stores[sid], sm=(m.stores||{})[sid]||{};
      const own=Object.keys(T.acl).filter(k=>((T.acl[k]||{}).stores||{})[sid]===true);
      return `<tr>
        <td><b>${esc(s.name)}</b></td>
        <td class="note">${esc(sm.code||sid.slice(0,8)+'…')}</td>
        <td class="r">${s.orders}</td>
        <td>${s.last?esc(s.last):'<span class="note">還沒叫過</span>'}</td>
        <td class="note">${own.length?own.map(k=>esc(keyToEmail(k)||k)).join('<br>'):'用共用帳號'}</td>
        <td>${s.orders?'<span class="pill p-ok">使用中</span>':'<span class="pill p-bad">未啟用</span>'}</td>
      </tr>`;}).join('')}
  </table></div>`;
}
window.toggleForm=function(id){ const el=document.getElementById(id); if(el)el.classList.toggle('hide'); };

window.addBrand=async function(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=g('b_name'), code=g('b_code').toUpperCase();
  if(!name){ toast('請填品牌名稱'); return; }
  if(!/^[A-Z]{2,3}$/.test(code)){ toast('品牌代碼請用 2～3 個英文大寫字母'); return; }
  if(((TENANTS[CUR].meta||{}).brands||{})[code]){ toast('這個代碼已經用過了'); return; }
  try{
    await DB.set('tenants/'+CUR+'/meta/brands/'+code, { name, code, createdAt:new Date().toISOString() });
    await loadAll(); renderDetail(); toast('品牌已建立');
  }catch(e){ toast('建不起來：'+(e.message||e)); }
};

/* 下一個門市代號：品牌代碼 ＋ 流水號，例 JR5 */
function nextStoreCode(brand){
  const m=TENANTS[CUR].meta||{}, used=Object.values(m.stores||{})
    .map(s=>String(s.code||'')).filter(c=>c.indexOf(brand)===0);
  let n=1; while(used.includes(brand+n)) n++;
  return brand+n;
}

window.addStore=async function(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const name=g('s_name'), brand=g('s_brand'), email=g('s_email');
  if(!name){ toast('請填門市名稱'); return; }
  if(!brand){ toast('請先建立品牌'); return; }
  if(email && !email.includes('@')){ toast('信箱格式不對'); return; }
  const code=nextStoreCode(brand), sid=code;
  if((TENANTS[CUR].meta.stores||{})[sid]){ toast('代號 '+code+' 已存在'); return; }
  const b=document.getElementById('addStoreBtn'); if(b){b.disabled=true;b.textContent='建立中…';}
  try{
    await DB.set('tenants/'+CUR+'/meta/stores/'+sid,
      { name, code, brand, createdAt:new Date().toISOString() });
    let msg='門市 '+code+' 已建立';
    if(email){
      const r=await DB.createUser(email);
      await DB.set('tenants/'+CUR+'/acl/'+EK(email),
        { stores:{[sid]:true}, label:name+' 專屬帳號' });
      await DB.reset(email);
      msg += r==='exists' ? '；帳號本來就有，已寄設定密碼信' : '；帳號已建立並寄出設定密碼信';
    }
    await loadAll(); renderDetail(); toast(msg);
  }catch(e){ toast('建不起來：'+((e&&e.code)||e.message||e)); }
  if(b){b.disabled=false;b.textContent='建立門市';}
};

/* 一次性：把已經有訂單、但還沒登記在 meta 的門市補登進來（保留原本的門市代號，舊訂單才不會對不上）*/
window.registerExisting=async function(){
  const T=TENANTS[CUR], m=T.meta||{};
  const todo=Object.keys(T.stores).filter(sid=>!((m.stores||{})[sid]));
  if(!todo.length){ toast('沒有要補登的門市'); return; }
  try{
    for(const sid of todo){
      const nm=T.stores[sid].name||sid;
      const mm=String(nm).match(/([A-Z]{2,3})(\d+)\s*$/);   // 從名字尾巴猜代號，例「…巨城店JR2」
      await DB.set('tenants/'+CUR+'/meta/stores/'+sid, {
        name:nm, code: mm?mm[0]:sid.slice(0,6),
        brand: mm?mm[1]:'', legacyId:true, createdAt:new Date().toISOString() });
      if(mm && !((m.brands||{})[mm[1]])){
        await DB.set('tenants/'+CUR+'/meta/brands/'+mm[1],
          { name:mm[1], code:mm[1], createdAt:new Date().toISOString() });
      }
    }
    await loadAll(); renderDetail(); toast('補登了 '+todo.length+' 間門市');
  }catch(e){ toast('補登失敗：'+(e.message||e)); }
};

/* ---------------- 圖表 ---------------- */
function drawChart(data){
  const plot=document.getElementById('plot'), xax=document.getElementById('xax'), tip=document.getElementById('tip');
  if(!plot)return; plot.innerHTML=''; xax.innerHTML='';
  const max=Math.max(5,...data.map(d=>d.v)), H=88;
  const peak=data.reduce((a,b)=>b.v>a.v?b:a,data[0]);
  data.forEach((d,i)=>{
    const cur=(i===data.length-1);
    const h=Math.max(2,Math.round(d.v/max*H));
    const w=document.createElement('div'); w.className='bwrap'+(cur?' hi':'');
    const lab=(cur||d===peak)&&d.v>0?`<span class="blab" style="bottom:${h+3}px">${d.v}</span>`:'';
    w.innerHTML=lab+`<div class="bar" style="height:${h}px"></div>`;
    w.addEventListener('mousemove',e=>{ const r=plot.parentElement.getBoundingClientRect();
      tip.textContent=d.year+' '+d.label+'　'+d.v+' 張';
      tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top-8)+'px'; tip.classList.add('on'); });
    w.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    plot.appendChild(w);
    const s=document.createElement('span'); s.textContent=d.label; if(cur)s.className='hi'; xax.appendChild(s);
  });
}

window.createTenant=async function(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const id=g('n_id').toLowerCase();
  if(!/^[a-z][a-z0-9_-]{1,20}$/.test(id)){ toast('代號請用英文小寫開頭，2～21 字'); return; }
  if(TENANTS[id]){ toast('這個代號已經有人用了'); return; }
  const email=g('n_email');
  if(!email.includes('@')){ toast('請填老闆的登入信箱'); return; }
  const b=document.getElementById('addBtn'); if(b){b.disabled=true;b.textContent='建立中…';}
  try{
    await DB.set('tenants/'+id+'/acl/'+EK(email), { all:true, label:(g('n_company')||id)+' 老闆帳號' });
    await DB.set('tenants/'+id+'/meta', {
      company:g('n_company')||id, brand:g('n_brand')||g('n_company')||id,
      contact:g('n_contact'), phone:g('n_phone'),
      contract:{ start:g('n_start'), end:g('n_end'), fee:11400 },
      payment:{ status:'none' },
      invoice:{ type:'收據（我方開立）', title:g('n_company')||'', taxid:g('n_taxid'), email:'' },
      onboarding:{ company:today() },
      createdAt:new Date().toISOString()
    });
    await loadAll(); CUR=id; toast('客戶建立完成');
    show('detail',document.querySelectorAll('.nav button')[1]);
  }catch(e){ toast('建立失敗：'+(e.message||e)); }
  if(b){b.disabled=false;b.textContent='建立客戶';}
};

/* ---------------- 問題紀錄 ---------------- */
function renderIssues(){
  const all=[];
  Object.keys(TENANTS).forEach(id=>{ const is=(TENANTS[id].meta||{}).issues||{};
    Object.keys(is).forEach(k=>all.push(Object.assign({_id:k,_t:id,_company:(TENANTS[id].meta||{}).company||id}, is[k]))); });
  all.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const open=all.filter(x=>x.status!=='done').length;
  document.getElementById('v-issues').innerHTML=`
  <div class="card">
    <h1>問題紀錄</h1>
    <div class="sub">客戶回報的每一件事記在這裡。同一類問題出現三次以上，就不是客服問題，是系統該改。</div>
    <div class="grid" style="margin-top:16px">
      <div class="stat"><div class="l">未解決</div><div class="v" style="color:var(--red)">${open}</div></div>
      <div class="stat"><div class="l">已解決</div><div class="v" style="color:var(--green)">${all.length-open}</div></div>
      <div class="stat"><div class="l">總計</div><div class="v">${all.length}</div></div>
    </div>
  </div>
  <div class="card">
    <h2>記一筆</h2>
    <div class="two">
      <div class="fld"><label>客戶</label><select id="i_t">${Object.keys(TENANTS).map(id=>`<option value="${esc(id)}">${esc((TENANTS[id].meta||{}).company||id)}</option>`).join('')}</select></div>
      <div class="fld"><label>分類</label><select id="i_cat">${['LINE','畫面','菜價','資料','同步','帳號','其他'].map(c=>`<option>${c}</option>`).join('')}</select></div>
    </div>
    <div class="fld"><label>問題</label><input id="i_title" placeholder="客戶說了什麼"></div>
    <div class="fld"><label>處理方式 / 結果</label><input id="i_fix" placeholder="怎麼解決的（可以晚點再補）"></div>
    <button class="btn o" onclick="addIssue()">新增</button>
  </div>
  <div class="card">
    <h2>所有問題</h2>
    ${all.length?`<div class="scroll"><table>
      <tr><th>日期</th><th>客戶</th><th>問題</th><th>分類</th><th>狀態</th><th class="r"></th></tr>
      ${all.map(x=>`<tr>
        <td>${esc(x.date||'')}</td><td>${esc(x._company)}</td>
        <td><b>${esc(x.title||'')}</b>${x.fix?'<div class="note">'+esc(x.fix)+'</div>':''}</td>
        <td><span class="pill p-pink">${esc(x.cat||'')}</span></td>
        <td>${x.status==='done'?'<span class="pill p-ok">已解決</span>':'<span class="pill p-bad">待處理</span>'}</td>
        <td class="r"><button class="btn g mini" onclick="toggleIssue('${esc(x._t)}','${esc(x._id)}')">${x.status==='done'?'改回待處理':'標記解決'}</button></td>
      </tr>`).join('')}
    </table></div>`:'<div class="note">還沒有紀錄。</div>'}
  </div>`;
}
window.addIssue=async function(){
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const t=g('i_t'), title=g('i_title');
  if(!title){ toast('請填問題內容'); return; }
  const key='i'+Date.now();
  try{
    await DB.set('tenants/'+t+'/meta/issues/'+key, { date:today(), cat:g('i_cat'), title, fix:g('i_fix'), status:'open' });
    await loadAll(); renderIssues(); toast('已記錄');
  }catch(e){ toast('存不進去：'+(e.message||e)); }
};
window.toggleIssue=async function(t,k){
  const cur=(((TENANTS[t].meta||{}).issues||{})[k]||{}).status;
  try{
    await DB.update('tenants/'+t+'/meta/issues/'+k, { status: cur==='done'?'open':'done' });
    await loadAll(); renderIssues();
  }catch(e){ toast('改不了：'+(e.message||e)); }
};

/* ---------------- 啟動 ---------------- */
function boot(){
  document.getElementById('verTag').textContent=VER;
  renderGate('loading');
  DB.onAuth(async u=>{
    ME=u;
    if(!u){ IS_ADMIN=false; renderGate('login'); return; }
    document.getElementById('whoAmI').textContent=u.email;
    try{
      const ok = await DB.read('admins/'+EK(u.email));
      IS_ADMIN = (ok===true);
    }catch(e){ IS_ADMIN=false; }
    if(!IS_ADMIN){ renderGate('notadmin'); return; }
    try{
      await loadAll();
      document.getElementById('gate').classList.add('hide');
      show('list',document.querySelectorAll('.nav button')[0]);
    }catch(e){ renderGate('error', e.message||String(e)); }
  });
}
if(window.DB) boot(); else window.addEventListener('db-ready', boot);
</script>
